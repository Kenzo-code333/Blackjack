  function makePlanet(idx, prev) {
    const L = levelOf(idx);
    const shrink = Math.max(0.58, 1 - 0.07 * L);
    const r = (!prev ? 34 : rand(26, 34)) * shrink;
    const ring = (r + 40 * Math.max(0.72, 1 - 0.05 * L)) * (1 + 0.05 * up('rings'));
    const [hue, sat] = PLANET_THEMES[lookOf('planet').id](idx);
    const p = {
      idx, r, ring, hue, sat,
      orbitR: r + (ring - r) * 0.5,
      inner: r + (ring - r) * 0.5,      // combo zone boundary (inner half of the ring band)
      x: 0, y: 0, baseX: 0,
      reverse: false, move: null, pulse: 0,
    };
    if (!prev) {
      p.baseX = VW / 2;
      p.y = 0;
    } else {
      p.y = prev.y - rand(185, 235);
      const minX = bandL + ring + 6, maxX = bandR - ring - 6;
      let x, tries = 0;
      do { x = rand(minX, maxX); tries++; } while (Math.abs(x - prev.baseX) < 50 && tries < 10);
      p.baseX = x;
      if (L >= 2 && Math.random() < Math.min(0.5, 0.3 + 0.03 * (L - 2))) {
        const centre = (minX + maxX) / 2;
        const amp = Math.min(70, (maxX - minX) / 2);
        if (amp > 20) {
          p.baseX = centre + clamp(p.baseX - centre, -(maxX - minX) / 2 + amp, (maxX - minX) / 2 - amp);
          p.move = { amp: amp * rand(0.6, 1), freq: rand(0.9, 1.5) * (1 + 0.05 * (L - 2)), phase: rand(0, TAU) };
        }
      }
      if (L >= 3 && Math.random() < 0.3) p.reverse = true;
    }
    p.x = p.baseX;
    return p;
  }

  function addPlanet() {
    const prev = planets[planets.length - 1];
    const p = makePlanet(planetCount++, prev);
    planets.push(p);
    if (!prev) return;

    // Bonus stars: on the direct path, or sitting on this planet's orbit
    let pathStarT = -1;
    if (Math.random() < Math.min(0.9, 0.5 + 0.08 * up('luck'))) {
      if (Math.random() < 0.55) {
        pathStarT = rand(0.42, 0.58);
        items.push({ type: 'star', x: prev.baseX + (p.baseX - prev.baseX) * pathStarT + rand(-10, 10), y: prev.y + (p.y - prev.y) * pathStarT, planet: null, taken: false, spin: rand(0, TAU) });
      } else {
        items.push({ type: 'star', planet: p, ang: rand(0, TAU), x: 0, y: 0, taken: false, spin: rand(0, TAU) });
      }
    }
    // Coins along the path between planets
    if (Math.random() < 0.65) {
      const n = 3 + Math.floor(Math.random() * 3);
      const off = rand(-14, 14);
      for (let i = 0; i < n; i++) {
        const t = 0.34 + (0.32 * i) / (n - 1);
        if (pathStarT > 0 && Math.abs(t - pathStarT) < 0.09) continue;
        items.push({ type: 'coin', x: prev.baseX + (p.baseX - prev.baseX) * t + off, y: prev.y + (p.y - prev.y) * t, planet: null, taken: false, spin: i * 0.7 });
      }
    }
    // Shields
    if (p.idx >= nextShieldAt) {
      items.push({ type: 'shield', planet: p, ang: rand(0, TAU), x: 0, y: 0, taken: false, spin: 0 });
      nextShieldAt += shieldInterval() + Math.round(rand(-2, 2));
    }
    // Black holes from planet 40 on
    if (levelOf(p.idx) >= 4 && Math.random() < 0.4) {
      const mx = (prev.baseX + p.baseX) / 2, my = (prev.y + p.y) / 2;
      for (let tries = 0; tries < 8; tries++) {
        const side = Math.random() < 0.5 ? -1 : 1;
        const hx = clamp(mx + side * rand(70, 130), bandL + 20, bandR - 20);
        const hy = my + rand(-30, 30);
        const h = { x: hx, y: hy, r: 13, pull: 70, rot: 0 };
        const ok = [prev, p].every(q => Math.hypot(q.baseX - hx, q.y - hy) > q.ring + (q.move ? q.move.amp : 0) + h.r + 22);
        if (ok) { holes.push(h); break; }
      }
    }
  }

  function reset(opts = {}) {
    planets = []; items = []; holes = []; particles = []; texts = []; ribbon = [];
    const start = opts.head ? 10 : 0;
    planetCount = start;
    score = opts.head ? 10 : 0;
    combo = 0; hops = start; newBest = false;
    nextShieldAt = start + shieldInterval() + Math.round(rand(-2, 2));
    overTimer = 0; flash = 0; shake = 0; levelBanner = 0; lastLevel = levelOf(start);
    missionBanner = null; hudCoins = 0;
    streakFx = null; shockwaves = []; speedLines = 0; streakFlash = null;
    hsFx = null; rockets = []; confetti = []; warp = 0; overFireworks = 0;
    addPlanet();
    while (planets[planets.length - 1].y > -VH * 1.8) addPlanet();
    const p0 = planets[0];
    comet = { x: 0, y: 0, vx: 0, vy: 0, planet: p0, ang: -Math.PI / 2, R: p0.orbitR, dir: 1, shield: 0, alive: true, launchedFrom: null };
    placeOnOrbit();
    camY = targetCamY();
  }

  function orbitSpeed() {
    const L = levelOf(comet.planet ? comet.planet.idx : 0);
    const base = Math.min(4.6, 2.3 * (1 + 0.13 * L));
    return run && run.slowLeft > 0 ? base * 0.5 : base;
  }
  function targetCamY() {
    const p = comet && comet.planet ? comet.planet : planets[0];
    return p.y - VH * 0.7;
  }
  function placeOnOrbit() {
    const p = comet.planet;
    comet.x = p.x + Math.cos(comet.ang) * comet.R;
    comet.y = p.y + Math.sin(comet.ang) * comet.R;
  }
  function cometHue() {
    const h = lookOf('comet').hue;
    return h < 0 ? (Math.floor(time * 15) * 6) % 360 : h;
  }

  // ---------- Coins in a run ----------
  const coinMult = () => (run && run.rush && run.planets < 20 ? 2 : 1);
  function addRunCoins(kind, n) {
    if (!run || n <= 0) return;
    run.coins[kind] += n;
  }
  function endCombo() {
    if (combo >= 3 && run) {
      const n = combo * coinMult();
      addRunCoins('combo', n);
      floatText(comet.x, comet.y - 26, \`COMBO BONUS +\${n}\`, 45, 15);
      sfx.comboEnd(combo);
    }
    combo = 0;
  }

  // ---------- Effects ----------
  function burst(x, y, hue, n, speed, life, size, sat = 100) {
    for (let i = 0; i < n; i++) {
      const a = rand(0, TAU), s = rand(0.3, 1) * speed;
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.6, 1) * life, max: life, hue, sat, size: rand(0.6, 1.2) * size, drag: 2.5 });
    }
  }
  function floatText(x, y, text, hue, size = 16) {
    texts.push({ x, y, text, hue, size, life: 1.1 });
  }

  // ---------- Input ----------
  function onTap() {
    if (state !== 'play') return;
    const now = performance.now();
    // Slow-Mo: a second tap shortly after launching (while flying)
    if (run && run.slowmo === 'ready' && !comet.planet && now - run.lastTap < 320) {
      run.slowmo = 'used';
      run.slowLeft = 3;
      run.lastTap = 0;
      floatText(comet.x, comet.y - 20, 'SLOW-MO', 200, 18);
      flash = 0.25;
      return;
    }
    if (run) run.lastTap = now;
    if (comet.planet) launch();
  }

  function launch() {
    const p = comet.planet;
    const tx = -Math.sin(comet.ang) * comet.dir;
    const ty = Math.cos(comet.ang) * comet.dir;
    comet.vx = tx * COMET_SPEED;
    comet.vy = ty * COMET_SPEED;
    comet.launchedFrom = p;
    comet.planet = null;
    if (run && run.slowLeft > 0) run.slowLeft--;
    burst(comet.x, comet.y, p.hue, 6, 80, 0.35, 3, p.sat);
  }

  canvas.addEventListener('pointerdown', e => { e.preventDefault(); if (!screen) onTap(); }, { passive: false });
  window.addEventListener('keydown', e => {
    if (!(e.code === 'Space' || e.code === 'Enter' || e.code === 'ArrowUp')) return;
    if (!screen) { e.preventDefault(); if (!e.repeat) onTap(); }
  });
  // Block scroll, pinch-zoom and double-tap zoom, but let menus scroll and buttons click
  const stop = e => e.preventDefault();
  canvas.addEventListener('touchstart', stop, { passive: false });
  canvas.addEventListener('touchend', stop, { passive: false });
  document.addEventListener('touchmove', e => {
    if (e.touches.length > 1 || !e.target.closest('.screen')) e.preventDefault();
  }, { passive: false });
  document.addEventListener('gesturestart', stop, { passive: false });
  document.addEventListener('dblclick', stop, { passive: false });
  document.addEventListener('contextmenu', stop);
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 150));

  // Each 10-streak escalates: more shockwaves, more particles, speed lines, star shower
  function celebrateStreak(p) {
    const tier = streakTier(combo);
    const hue = tierHue(tier);
    const big = Math.min(tier, 5);
    streakFx = { tier, combo, t: 0, dur: 2.4, name: STREAK_NAMES[Math.min(tier, STREAK_NAMES.length) - 1] };
    for (let i = 0; i < 1 + big; i++) {
      shockwaves.push({ x: p.x, y: p.y, r: p.r, max: 140 + i * 70 + big * 30, life: 0, dur: 0.7 + i * 0.18, delay: i * 0.12, hue: tier >= 6 ? (i * 60) % 360 : hue, w: 7 - i });
    }
    burst(comet.x, comet.y, hue, 40 + big * 20, 260 + big * 40, 1.1, 5);
    burst(p.x, p.y, 0, 20 + big * 6, 180, 0.8, 4, 0);
    // ring of sparks around the planet
    const n = 24 + big * 8;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU;
      particles.push({ x: p.x + Math.cos(a) * p.ring, y: p.y + Math.sin(a) * p.ring, vx: Math.cos(a) * 220, vy: Math.sin(a) * 220, life: 0.9, max: 0.9, hue: tier >= 6 ? (i * 360 / n) | 0 : hue, sat: 100, size: 4, drag: 2 });
    }
    if (tier >= 2) speedLines = 1;
    if (tier >= 3) {
      // star shower falling across the screen
      for (let i = 0; i < 26 + big * 8; i++) {
        particles.push({ x: rand(0, VW), y: camY - rand(10, 120), vx: rand(-40, 40), vy: rand(380, 620), life: rand(1.2, 1.8), max: 1.8, hue: tier >= 6 ? rand(0, 360) | 0 : (hue + rand(-20, 20) + 360) % 360, sat: 100, size: rand(2.5, 4.5), drag: 0.2 });
      }
    }
    streakFlash = { hue, t: 0.45 };
    shake = Math.max(shake, 4 + big * 1.5);
    p.pulse = 1.6;
  }

  // ---------- New high score celebration ----------
  let hsFx = null, rockets = [], confetti = [], warp = 0, overFireworks = 0, rocketTimer = 0;
  const WARP_TIME = 1.1;

  function launchRocket(delay = 0) {
    rockets.push({
      x: rand(VW * 0.12, VW * 0.88), y: camY + VH + 10,
      ty: camY + rand(VH * 0.12, VH * 0.45),
      vx: rand(-30, 30), vy: -rand(700, 900),
      hue: [45, 190, 310, 120, 15, 270][Math.floor(Math.random() * 6)],
      delay, whistled: false,
    });
  }
  function explodeRocket(r) {
    const big = Math.random() < 0.35;
    const n = big ? 90 : 60;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * TAU + rand(-0.05, 0.05), sp = rand(0.75, 1) * (big ? 360 : 280);
      particles.push({ x: r.x, y: r.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.9, 1.4), max: 1.4, hue: i % 7 === 0 ? 50 : r.hue, sat: 100, size: rand(2.5, 4), drag: 1.6 });
    }
    burst(r.x, r.y, 0, 18, 140, 0.8, 3, 0);
    shockwaves.push({ x: r.x, y: r.y, r: 4, max: big ? 150 : 100, life: 0, dur: 0.6, delay: 0, hue: r.hue, w: 4 });
    sfx.pop(big);
  }
  function spawnConfetti(n) {
    for (let i = 0; i < n; i++) {
      confetti.push({
        x: rand(0, VW), y: rand(-VH * 0.5, -10), vx: rand(-60, 60), vy: rand(80, 220),
        rot: rand(0, TAU), vr: rand(-8, 8), w: rand(5, 9), h: rand(8, 14), flip: rand(0, TAU),
        hue: [45, 50, 190, 310, 120, 0][Math.floor(Math.random() * 6)], life: rand(3, 4.5),
      });
    }
  }
  function celebrateHighScore() {
    run.beatBest = true;
    hsFx = { t: 0, dur: 3.2, old: run.prevBest };
    streakFx = null;                // the high score takes the stage
    warp = WARP_TIME;               // brief bullet-time
    flash = 0;
    streakFlash = { hue: 45, t: 0.6 };
    shake = Math.max(shake, 10);
    for (let i = 0; i < 6; i++) shockwaves.push({ x: comet.x, y: comet.y, r: 10, max: 160 + i * 90, life: 0, dur: 0.9 + i * 0.12, delay: i * 0.08, hue: [45, 50, 30, 190, 310, 45][i], w: 7 - i });
    burst(comet.x, comet.y, 45, 90, 420, 1.3, 6);
    burst(comet.x, comet.y, 0, 40, 260, 1, 4, 0);
    for (let i = 0; i < 7; i++) launchRocket(0.15 + i * 0.32);
    spawnConfetti(140);
    speedLines = 1;
    floatText(comet.x, comet.y - 30, \`+\${score - run.prevBest} OVER BEST\`, 45, 18);
    sfx.highScore();
  }

  function updateCelebration(dt) {
    if (run && !run.beatBest && run.prevBest > 0 && score > run.prevBest && state === 'play') celebrateHighScore();
    if (hsFx) { hsFx.t += dt; if (hsFx.t > hsFx.dur) hsFx = null; }
    // keep fireworks going behind the game-over screen after a new best
    if (state === 'over' && newBest && screen === 'over' && overFireworks < 9) {
      rocketTimer -= dt;
      if (rocketTimer <= 0) { launchRocket(); overFireworks += 0.8; rocketTimer = rand(0.45, 0.8); if (confetti.length < 40) spawnConfetti(30); }
    }
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      if (r.delay > 0) { r.delay -= dt; continue; }
      if (!r.whistled) { r.whistled = true; sfx.rocket(); }
      r.x += r.vx * dt; r.y += r.vy * dt;
      if (Math.random() < 0.9) particles.push({ x: r.x, y: r.y, vx: rand(-20, 20), vy: rand(40, 90), life: 0.4, max: 0.4, hue: 40, sat: 100, size: 2.5, drag: 2 });
      if (r.y <= r.ty) { explodeRocket(r); rockets.splice(i, 1); }
    }
    for (let i = confetti.length - 1; i >= 0; i--) {
      const c = confetti[i];
      c.life -= dt;
      c.vy = Math.min(c.vy + 120 * dt, 240);
      c.x += (c.vx + Math.sin(c.flip * 2) * 40) * dt; c.y += c.vy * dt;
      c.rot += c.vr * dt; c.flip += dt * 5;
      if (c.life <= 0 || c.y > VH + 20) confetti.splice(i, 1);
    }
  }

  function drawConfetti() {
    for (const c of confetti) {
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(c.rot);
      ctx.scale(1, Math.cos(c.flip));
      ctx.globalAlpha = Math.min(1, c.life);
      ctx.fillStyle = \`hsl(\${c.hue},100%,\${c.hue === 0 ? 100 : 62}%)\`;
      ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  function drawHighScoreBanner() {
    if (!hsFx) return;
    const { t, dur } = hsFx;
    const pin = Math.min(1, t / 0.45);
    const back = 1 + 2.4 * Math.pow(pin - 1, 3) + 1.4 * Math.pow(pin - 1, 2);
    const a = Math.min(1, t * 5) * Math.min(1, (dur - t) / 0.6);
    const y = Math.max(VH * 0.26, 190) - Math.max(0, t - dur + 0.6) * 50;
    ctx.save();
    ctx.translate(VW / 2, y);
    // rotating sunburst behind the text
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.35 * a;
    ctx.rotate(t * 0.6);
    const rays = 16, R = 210 * Math.min(1, t * 2);
    for (let i = 0; i < rays; i++) {
      const a0 = (i / rays) * TAU;
      const g = ctx.createLinearGradient(0, 0, Math.cos(a0) * R, Math.sin(a0) * R);
      g.addColorStop(0, 'hsla(45,100%,65%,0.9)');
      g.addColorStop(1, 'hsla(45,100%,60%,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, R, a0 - 0.07, a0 + 0.07);
      ctx.closePath();
      ctx.fill();
    }
    ctx.rotate(-t * 0.6);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    const sc = 0.2 + 0.8 * back;
    ctx.scale(sc, sc);
    drawCrown(0, -64, 1 + 0.08 * Math.sin(t * 8), a);
    neonText('NEW', 0, -22, 26, 45, 700, 'center', a);
    if (t < 0.7) {
      const o = (0.7 - t) * 14;
      ctx.globalCompositeOperation = 'lighter';
      plainText('HIGH SCORE!', -o, 18, 46, 'hsla(190,100%,60%,0.6)', 700, 'center', a);
      plainText('HIGH SCORE!', o, 18, 46, 'hsla(320,100%,60%,0.6)', 700, 'center', a);
      ctx.globalCompositeOperation = 'source-over';
    }
    neonText('HIGH SCORE!', 0, 18, 46, 45, 700, 'center', a);
    plainText(hsFx.old ? \`Old best: \${hsFx.old}\` : '', 0, 54, 15, '#ffeec2', 600, 'center', a);
    ctx.restore();
  }

  function drawCrown(x, y, s, a) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.globalAlpha = a;
    ctx.beginPath();
    ctx.moveTo(-22, 12); ctx.lineTo(-26, -10); ctx.lineTo(-12, 0); ctx.lineTo(0, -16);
    ctx.lineTo(12, 0); ctx.lineTo(26, -10); ctx.lineTo(22, 12); ctx.closePath();
    const g = ctx.createLinearGradient(0, -16, 0, 12);
    g.addColorStop(0, '#fff6c8'); g.addColorStop(1, '#ffae1a');
    ctx.fillStyle = g;
    ctx.shadowColor = 'hsla(45,100%,60%,0.9)';
    ctx.shadowBlur = 14 * scale * dpr;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#fffbe8';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = '#ff4fa8';
    for (const [cx, cy] of [[-26, -10], [0, -16], [26, -10]]) { ctx.beginPath(); ctx.arc(cx, cy, 3, 0, TAU); ctx.fill(); }
    ctx.restore();
  }

  // ---------- Update ----------
  function capture(p, impact) {
    comet.planet = p;
    comet.launchedFrom = null;
    const dx = comet.x - p.x, dy = comet.y - p.y;
    comet.ang = Math.atan2(dy, dx);
    comet.R = Math.hypot(dx, dy);
    const cross = dx * comet.vy - dy * comet.vx;
    let dir = cross >= 0 ? 1 : -1;
    if (p.reverse) dir = -dir;
    comet.dir = dir;

    hops = Math.max(hops, p.idx);
    let gained = 1;
    if (impact < p.inner) {
      combo++;
      gained += combo;
      floatText(p.x, p.y - p.ring - 10, combo > 1 ? \`PERFECT x\${combo}  +\${gained}\` : \`PERFECT  +\${gained}\`, 50);
      if (run) { missionTrack('perfects', 1); missionTrack('comboRun', combo, 'max'); }
      sfx.perfect(combo);
      if (combo % 10 === 0) { celebrateStreak(p); sfx.milestone(streakTier(combo)); }
    } else {
      endCombo();
      sfx.land();
      floatText(p.x, p.y - p.ring - 10, '+1', p.hue);
    }
    score += gained;
    p.pulse = 1;
    burst(comet.x, comet.y, p.hue, 22, 160, 0.6, 4, p.sat);
    if (p.reverse) floatText(p.x, p.y + p.ring + 18, 'REVERSE', 320);

    if (run) {
      const before = run.planets;
      const mult = coinMult();
      run.planets = p.idx - run.startIdx;
      const milestones = Math.floor(run.planets / 5) - Math.floor(before / 5);
      if (milestones > 0) {
        const n = 2 * milestones * mult;
        addRunCoins('milestone', n);
        floatText(p.x, p.y + p.ring + (p.reverse ? 38 : 18), \`+\${n} COINS\`, 45);
      }
      missionTrack('reachRun', run.planets, 'max');
      missionTrack('scoreRun', score, 'max');
    }

    const L = levelOf(p.idx);
    if (L > lastLevel) { lastLevel = L; levelBanner = 2.2; }

    const cutoff = p.y + VH;
    planets = planets.filter(q => q.y < cutoff);
    items = items.filter(it => !it.taken && (it.planet ? it.planet.y : it.y) < cutoff);
    holes = holes.filter(h => h.y < cutoff);
    while (planets[planets.length - 1].y > p.y - VH * 1.6) addPlanet();
  }

  function respawnAt(p) {
    comet.alive = true;
    comet.planet = p;
    comet.launchedFrom = null;
    comet.R = p.orbitR;
    comet.ang = -Math.PI / 2;
    ribbon = [];
    placeOnOrbit();
  }

  function die(reason) {
    if (comet.shield > 0) {
      comet.shield--;
      const p = comet.launchedFrom || planets[0];
      burst(comet.x, comet.y, 190, 18, 140, 0.5, 4);
      respawnAt(p);
      burst(comet.x, comet.y, 190, 26, 180, 0.7, 4);
      floatText(p.x, p.y - p.ring - 10, 'SHIELD SAVED YOU', 190);
      flash = 0.5;
      shake = 6;
      missionTrack('shield', 1);
      sfx.shield();
      return;
    }
    comet.alive = false;
    const ex = clamp(comet.x, 0, VW), ey = clamp(comet.y, camY, camY + VH);
    burst(ex, ey, reason === 'hole' ? 280 : 20, 40, 260, 0.9, 5);
    shake = 16;
    sfx.crash();
    sfx.music.mode(null);
    endCombo();
    state = 'dying';
    overTimer = 0;
  }

  // Award end-of-run coins. Safe to call again after a revive: only the difference is added.
  function settleRun() {
    if (EMBED && !embedReported) {
      embedReported = true;
      try { parent.postMessage({ type: 'gamenight:score', score }, '*'); } catch (e) { /* not embedded */ }
    }
    if (score > save.best) { save.best = score; newBest = true; }
    if (!run) { persist(); return; }
    run.coins.score = Math.floor(score * 0.1);
    if (!run.dailyGiven && save.lastGift !== today()) {
      run.dailyGiven = true;
      run.coins.daily = 20;
      save.lastGift = today();
    }
    const c = run.coins;
    const total = c.path + c.milestone + c.combo + c.score + c.daily;
    save.coins += total - run.committed;
    run.committed = total;
    recordRun();
    persist();
    postBest(save.best, newBest ? hops : 0);
  }

  function itemPos(it) {
    if (it.planet) {
      it.x = it.planet.x + Math.cos(it.ang) * it.planet.orbitR;
      it.y = it.planet.y + Math.sin(it.ang) * it.planet.orbitR;
    }
  }

  function collectItems() {
    for (const it of items) {
      if (it.taken) continue;
      const d = Math.hypot(it.x - comet.x, it.y - comet.y);
      const reach = it.type === 'star' ? 21 : it.type === 'coin' ? 13 : 17;
      if (d >= reach) continue;
      it.taken = true;
      if (it.type === 'star') {
        score += 3;
        floatText(it.x, it.y - 18, '+3 STAR', 48, 20);
        sfx.star();
        burst(it.x, it.y, 48, 28, 190, 0.7, 4.5);
        burst(it.x, it.y, 0, 10, 120, 0.5, 3, 0);
        missionTrack('stars', 1);
        missionTrack('scoreRun', score, 'max');
      } else if (it.type === 'coin') {
        const doubled = Math.random() < 0.05 * up('golden');
        const n = (doubled ? 2 : 1) * coinMult();
        addRunCoins('path', n);
        missionTrack('coins', n);
        burst(it.x, it.y, 45, 6, 70, 0.3, 2.5);
        sfx.coin();
        if (n > 1) floatText(it.x, it.y - 12, \`+\${n}\`, 45, 14);
      } else {
        comet.shield = Math.max(comet.shield, shieldCharges());
        floatText(it.x, it.y - 14, comet.shield > 1 ? 'SHIELD x2' : 'SHIELD', 190);
        burst(it.x, it.y, 190, 18, 140, 0.6, 3.5);
      }
    }
  }

  function emitTrail(flying) {
    const id = lookOf('trail').id;
    const hue = cometHue();
    const back = flying ? 0.05 : 0;
    const push = (hu, size, life, spread, sat = 100) => particles.push({
      x: comet.x + rand(-spread, spread), y: comet.y + rand(-spread, spread),
      vx: rand(-15, 15) - comet.vx * back, vy: rand(-15, 15) - comet.vy * back,
      life, max: life, hue: hu, sat, size, drag: 1,
    });
    if (id === 'spark') {
      for (let i = 0; i < (flying ? 3 : 1); i++) push((hue - 7 + Math.random() * 25 + 360) % 360, flying ? 4.5 : 3.5, flying ? 0.45 : 0.35, 2);
    } else if (id === 'stardust') {
      for (let i = 0; i < (flying ? 3 : 2); i++) push(hue, rand(1.2, 2.4), 0.9, 7, 30);
    } else if (id === 'flame') {
      for (let i = 0; i < (flying ? 4 : 2); i++) push(rand(5, 45), flying ? 5.5 : 4.5, 0.3, 3);
    } else if (id === 'ribbon') {
      if (Math.random() < 0.3) push(hue, 2.5, 0.4, 2);
    } else if (id === 'rainbow') {
      for (let i = 0; i < (flying ? 3 : 1); i++) push(Math.floor(time * 240 + i * 40) % 360, flying ? 4.5 : 3.5, 0.5, 2);
    }
    ribbon.push({ x: comet.x, y: comet.y });
    if (ribbon.length > 26) ribbon.shift();
  }

  function update(dt) {
    time += dt;

    for (const p of planets) {
      if (p.move) p.x = p.baseX + Math.sin(time * p.move.freq + p.move.phase) * p.move.amp;
      p.pulse = Math.max(0, p.pulse - dt * 2);
    }
    for (const it of items) { it.spin += dt * 2; itemPos(it); }
    for (const h of holes) h.rot += dt * 3;

    if (state === 'play' && comet.alive) {
      // Coin magnet: nearby coins drift into the comet
      const mr = magnetRadius();
      for (const it of items) {
        if (it.type !== 'coin' || it.taken) continue;
        const d = Math.hypot(comet.x - it.x, comet.y - it.y);
        if (d < mr) {
          const k = ease(10, dt);
          it.x += (comet.x - it.x) * k;
          it.y += (comet.y - it.y) * k;
        }
      }
    }

    if (state === 'start' || state === 'play') {
      if (comet.planet) {
        const p = comet.planet;
        comet.ang += comet.dir * orbitSpeed() * dt;
        comet.R += (p.orbitR - comet.R) * ease(9, dt);
        placeOnOrbit();
        if (state === 'play') collectItems();
      } else {
        // Sub-step the flight so fast motion never tunnels through rings or items
        const steps = Math.max(1, Math.ceil(dt / (1 / 240)));
        const h = dt / steps;
        for (let s = 0; s < steps && comet.alive && !comet.planet; s++) {
          for (const bh of holes) {
            const dx = bh.x - comet.x, dy = bh.y - comet.y;
            const d = Math.hypot(dx, dy);
            if (d < bh.r + 3) { die('hole'); break; }
            if (d < bh.r + bh.pull) {
              const a = Math.min(5200, 1.1e6 / (d * d));
              comet.vx += (dx / d) * a * h;
              comet.vy += (dy / d) * a * h;
              const sp = Math.hypot(comet.vx, comet.vy);
              comet.vx *= COMET_SPEED / sp;
              comet.vy *= COMET_SPEED / sp;
            }
          }
          if (!comet.alive || comet.planet) break;
          comet.x += comet.vx * h;
          comet.y += comet.vy * h;
          collectItems();
          const from = comet.launchedFrom ? comet.launchedFrom.idx : -1;
          for (const p of planets) {
            if (p.idx <= from) continue;
            const dx = p.x - comet.x, dy = p.y - comet.y;
            if (dx * dx + dy * dy < p.ring * p.ring) {
              const impact = Math.abs(dx * comet.vy - dy * comet.vx) / COMET_SPEED;
              capture(p, impact);
              break;
            }
          }
          if (!comet.planet) {
            const m = 14;
            if (comet.x < -m || comet.x > VW + m || comet.y < camY - m || comet.y > camY + VH + m) { die('out'); break; }
          }
        }
      }

      if (comet.alive) emitTrail(!comet.planet);
      if (comet.planet) camY += (targetCamY() - camY) * ease(3.2, dt);
    }

    if (state === 'dying') {
      overTimer += dt;
      if (overTimer > 0.75) {
        state = 'over';
        overTimer = 0;
        settleRun();
        showScreen('over');
        sfx.gameOver(newBest);
        overFireworks = 0; rocketTimer = 0.3;
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const q = particles[i];
      q.life -= dt;
      if (q.life <= 0) { particles[i] = particles[particles.length - 1]; particles.pop(); continue; }
      const k = Math.exp(-q.drag * dt);
      q.vx *= k; q.vy *= k;
      q.x += q.vx * dt; q.y += q.vy * dt;
    }
    if (particles.length > 700) particles.splice(0, particles.length - 700);
    for (let i = texts.length - 1; i >= 0; i--) {
      texts[i].life -= dt;
      texts[i].y -= 28 * dt;
      if (texts[i].life <= 0) texts.splice(i, 1);
    }
    shake *= Math.exp(-6 * dt);
    if (shake < 0.05) shake = 0;
    flash = Math.max(0, flash - dt);
    levelBanner = Math.max(0, levelBanner - dt);
    if (streakFx) { streakFx.t += dt; if (streakFx.t >= streakFx.dur) streakFx = null; }
    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const w = shockwaves[i];
      w.life += dt;
      if (w.life - w.delay > w.dur) shockwaves.splice(i, 1);
    }
    speedLines = Math.max(0, speedLines - dt * 1.4);
    if (streakFlash) { streakFlash.t -= dt; if (streakFlash.t <= 0) streakFlash = null; }
    if (missionBanner) { missionBanner.t -= dt; if (missionBanner.t <= 0) missionBanner = null; }
    updateCelebration(dt);

    const target = run ? run.coins.path + run.coins.milestone + run.coins.combo + run.coins.missions : 0;
    hudCoins += (target - hudCoins) * ease(10, dt);
    if (Math.abs(target - hudCoins) < 0.4) hudCoins = target;
    tickCoinDisplay(dt);
  }

  // ---------- Render ----------
  function drawBackground() {
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, VW, VH);
    for (const L of starLayers) {
      const off = -camY * L.f;
      for (const s of L.stars) {
        let y = (s.y + off) % VH;
        if (y < 0) y += VH;
        const tw = 0.65 + 0.35 * Math.sin(time * 1.7 + s.tw);
        ctx.globalAlpha = L.a * tw;
        ctx.fillStyle = s.hue < 0 ? '#e8ecff' : \`hsl(\${s.hue},80%,80%)\`;
        ctx.fillRect(s.x, y, L.s, L.s);
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawPlanet(p) {
    const isCurrent = comet.planet === p;
    const pulse = p.pulse;
    const ringHue = p.reverse ? 320 : p.hue;
    const ringSat = p.reverse ? 100 : p.sat;
    const S = p.sat / 100;

    if (p.move) {
      ctx.strokeStyle = \`hsla(\${p.hue},\${80 * S}%,60%,0.12)\`;
      ctx.lineWidth = 2;
      ctx.setLineDash([3, 7]);
      ctx.beginPath();
      ctx.moveTo(p.baseX - p.move.amp, p.y);
      ctx.lineTo(p.baseX + p.move.amp, p.y);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    const ringR = p.ring + pulse * 10;
    ctx.lineWidth = 9;
    ctx.strokeStyle = \`hsla(\${ringHue},\${ringSat}%,60%,\${0.08 + pulse * 0.2})\`;
    ctx.beginPath(); ctx.arc(p.x, p.y, ringR, 0, TAU); ctx.stroke();
    ctx.lineWidth = 1.8;
    ctx.strokeStyle = \`hsla(\${ringHue},\${ringSat}%,68%,\${isCurrent ? 0.35 : 0.85})\`;
    if (p.reverse) {
      ctx.setLineDash([10, 7]);
      ctx.lineDashOffset = -time * 30;
    }
    ctx.beginPath(); ctx.arc(p.x, p.y, ringR, 0, TAU); ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineDashOffset = 0;

    if (!isCurrent) {
      ctx.lineWidth = 1;
      ctx.strokeStyle = \`hsla(\${ringHue},\${ringSat}%,75%,0.18)\`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.inner, 0, TAU); ctx.stroke();
    }

    const halo = ctx.createRadialGradient(p.x, p.y, p.r * 0.8, p.x, p.y, p.r * 2.1);
    halo.addColorStop(0, \`hsla(\${p.hue},\${p.sat}%,60%,0.35)\`);
    halo.addColorStop(1, \`hsla(\${p.hue},\${p.sat}%,60%,0)\`);
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 2.1, 0, TAU); ctx.fill();

    const body = ctx.createRadialGradient(p.x - p.r * 0.35, p.y - p.r * 0.4, p.r * 0.1, p.x, p.y, p.r);
    body.addColorStop(0, \`hsl(\${p.hue},\${90 * S}%,78%)\`);
    body.addColorStop(0.55, \`hsl(\${p.hue},\${75 * S}%,45%)\`);
    body.addColorStop(1, \`hsl(\${(p.hue + 30) % 360},\${80 * S}%,18%)\`);
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, TAU); ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = \`hsla(\${p.hue},\${p.sat}%,80%,0.9)\`;
    ctx.stroke();

    if (p.reverse) {
      ctx.strokeStyle = 'hsla(320,100%,80%,0.9)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        const a = -time * 1.5 + i * TAU / 3;
        const cx = p.x + Math.cos(a) * p.r * 0.55, cy = p.y + Math.sin(a) * p.r * 0.55;
        const ta = a - Math.PI / 2;
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(ta + 2.5) * 5, cy + Math.sin(ta + 2.5) * 5);
        ctx.lineTo(cx + Math.cos(ta) * 5, cy + Math.sin(ta) * 5);
        ctx.lineTo(cx + Math.cos(ta - 2.5) * 5, cy + Math.sin(ta - 2.5) * 5);
        ctx.stroke();
      }
    }
  }

  function drawHole(h) {
    const g = ctx.createRadialGradient(h.x, h.y, h.r * 0.6, h.x, h.y, h.r + h.pull);
    g.addColorStop(0, 'hsla(275,100%,60%,0.45)');
    g.addColorStop(0.3, 'hsla(275,100%,45%,0.12)');
    g.addColorStop(1, 'hsla(275,100%,40%,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(h.x, h.y, h.r + h.pull, 0, TAU); ctx.fill();
    ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      ctx.strokeStyle = \`hsla(\${285 + i * 15},100%,65%,\${0.7 - i * 0.18})\`;
      ctx.beginPath();
      ctx.arc(h.x, h.y, h.r + 4 + i * 5, h.rot * (1 + i * 0.3), h.rot * (1 + i * 0.3) + Math.PI * 1.2);
      ctx.stroke();
    }
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, TAU); ctx.fill();
    ctx.strokeStyle = 'hsla(285,100%,75%,0.9)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }

  function starPath(x, y, outer, inner, rot) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = rot + i * Math.PI / 5 - Math.PI / 2;
      const rr = i % 2 ? inner : outer;
      ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath();
  }

  function drawItem(it) {
    if (it.taken) return;
    if (it.type === 'star') {
      // Bonus star: big pulsing glow, rotating light rays, dashed halo, chunky star
      const x = it.x, y = it.y + Math.sin(time * 3 + it.spin) * 2;
      const pulse = 1 + 0.16 * Math.sin(time * 5 + it.spin);
      ctx.globalCompositeOperation = 'lighter';
      const g = 64 * pulse;
      ctx.drawImage(glowSprite(46, 100, 58), x - g / 2, y - g / 2, g, g);
      ctx.strokeStyle = 'rgba(255,236,160,0.75)';
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      for (let i = 0; i < 8; i++) {
        const a = time * 0.8 + it.spin + i * Math.PI / 4;
        const len = (i % 2 ? 17 : 27) * pulse;
        ctx.moveTo(x + Math.cos(a) * 12, y + Math.sin(a) * 12);
        ctx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
      }
      ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
      ctx.strokeStyle = 'hsla(48,100%,72%,0.55)';
      ctx.lineWidth = 1.4;
      ctx.setLineDash([3, 5]);
      ctx.lineDashOffset = -time * 12;
      ctx.beginPath(); ctx.arc(x, y, 20, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
      ctx.lineDashOffset = 0;
      const rot = Math.sin(time * 1.5 + it.spin) * 0.25;
      starPath(x, y, 12.5, 5.4, rot);
      const fill = ctx.createRadialGradient(x - 2, y - 3, 1, x, y, 12);
      fill.addColorStop(0, '#ffffff');
      fill.addColorStop(0.45, '#ffe680');
      fill.addColorStop(1, '#ffae1a');
      ctx.fillStyle = fill;
      ctx.fill();
      ctx.lineWidth = 1.6;
      ctx.strokeStyle = '#fff8dc';
      ctx.stroke();
    } else if (it.type === 'coin') {
      const w = Math.max(0.8, Math.abs(Math.cos(time * 4 + it.spin)) * 5.2);
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.5;
      ctx.drawImage(glowSprite(40, 100, 50), it.x - 9, it.y - 9, 18, 18);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#ffc93d';
      ctx.strokeStyle = '#fff0a8';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.ellipse(it.x, it.y, w, 5.2, 0, 0, TAU); ctx.fill(); ctx.stroke();
    } else {
      const bob = Math.sin(time * 4 + it.spin) * 1.5;
      ctx.globalCompositeOperation = 'lighter';
      ctx.drawImage(glowSprite(190, 100, 60), it.x - 20, it.y - 20 + bob, 40, 40);
      ctx.globalCompositeOperation = 'source-over';
      drawShieldIcon(it.x, it.y + bob, 9, '#c9fbff');
    }
  }

  function drawShieldIcon(x, y, s, color) {
    ctx.strokeStyle = color;
    ctx.fillStyle = 'rgba(80,230,255,0.25)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, y - s);
    ctx.lineTo(x + s * 0.85, y - s * 0.6);
    ctx.quadraticCurveTo(x + s * 0.8, y + s * 0.5, x, y + s);
    ctx.quadraticCurveTo(x - s * 0.8, y + s * 0.5, x - s * 0.85, y - s * 0.6);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  }

  function drawCoinIcon(x, y, r) {
    ctx.fillStyle = '#ffc93d';
    ctx.strokeStyle = '#fff0a8';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = 'rgba(160,100,0,0.6)';
    ctx.beginPath(); ctx.arc(x, y, r * 0.55, 0, TAU); ctx.stroke();
  }

  function drawAimLine() {
    if (!run || !run.aim || state !== 'play' || !comet.planet) return;
    if (comet.planet.idx - run.startIdx >= 10) return;
    const tx = -Math.sin(comet.ang) * comet.dir, ty = Math.cos(comet.ang) * comet.dir;
    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    ctx.setLineDash([1, 9]);
    ctx.beginPath();
    ctx.moveTo(comet.x + tx * 10, comet.y + ty * 10);
    ctx.lineTo(comet.x + tx * 320, comet.y + ty * 320);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.lineCap = 'butt';
  }

  function drawComet() {
    if (!comet.alive) return;
    const hue = cometHue();
    if (lookOf('trail').id === 'ribbon' && ribbon.length > 1) {
      ctx.globalCompositeOperation = 'lighter';
      ctx.lineCap = 'round';
      for (let i = 1; i < ribbon.length; i++) {
        const t = i / ribbon.length;
        ctx.strokeStyle = \`hsla(\${hue},100%,65%,\${t * 0.8})\`;
        ctx.lineWidth = 1 + t * 6;
        ctx.beginPath();
        ctx.moveTo(ribbon[i - 1].x, ribbon[i - 1].y);
        ctx.lineTo(ribbon[i].x, ribbon[i].y);
        ctx.stroke();
      }
      ctx.lineCap = 'butt';
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(glowSprite(hue, 100, 60), comet.x - 22, comet.y - 22, 44, 44);
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#fffaf0';
    ctx.beginPath(); ctx.arc(comet.x, comet.y, 4.5, 0, TAU); ctx.fill();
    if (combo >= 10 && state === 'play') {
      // streak aura: orbiting sparks, one more per tier
      const tier = streakTier(combo), h = tierHue(tier);
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 1 + Math.min(tier, 5); i++) {
        const a = time * 7 + i * TAU / (1 + Math.min(tier, 5));
        ctx.drawImage(glowSprite(tier >= 6 ? (h + i * 60) % 360 : h, 100, 60), comet.x + Math.cos(a) * 13 - 6, comet.y + Math.sin(a) * 13 - 6, 12, 12);
      }
      ctx.globalCompositeOperation = 'source-over';
    }
    if (comet.shield) {
      ctx.strokeStyle = \`rgba(120,240,255,\${0.6 + 0.3 * Math.sin(time * 6)})\`;
      ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(comet.x, comet.y, 11, 0, TAU); ctx.stroke();
      if (comet.shield > 1) { ctx.beginPath(); ctx.arc(comet.x, comet.y, 14.5, 0, TAU); ctx.stroke(); }
    }
  }

  function drawParticles() {
    ctx.globalCompositeOperation = 'lighter';
    for (const q of particles) {
      const t = q.life / q.max;
      const s = q.size * (0.4 + t) * 2.2;
      ctx.globalAlpha = Math.min(1, t * 1.4);
      ctx.drawImage(glowSprite(Math.round(q.hue / 4) * 4, q.sat, 60), q.x - s, q.y - s, s * 2, s * 2);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function neonText(text, x, y, size, hue, weight = 700, align = 'center', alpha = 1) {
    ctx.font = \`\${weight} \${size}px \${FONT}\`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.globalAlpha = alpha;
    ctx.shadowColor = \`hsla(\${hue},100%,60%,0.9)\`;
    ctx.shadowBlur = size * 0.45 * scale * dpr;
    ctx.fillStyle = \`hsl(\${hue},100%,85%)\`;
    ctx.fillText(text, x, y);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  function plainText(text, x, y, size, color, weight = 500, align = 'center', alpha = 1) {
    ctx.font = \`\${weight} \${size}px \${FONT}\`;
    ctx.textAlign = align;
    ctx.textBaseline = 'middle';
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
    ctx.globalAlpha = 1;
  }

  function drawHUD() {
    if (state !== 'play' && state !== 'dying') return;
    const top = 34;
    const beat = run && run.beatBest;
    if (beat) drawCrown(VW / 2, top - 22, 0.45, 1);
    neonText(String(score), VW / 2, top + 12, 44, beat ? 45 : 190);
    if (run && !beat && run.prevBest > 0) {
      const close = run.prevBest - score <= Math.max(5, run.prevBest * 0.1);
      plainText(\`BEST \${run.prevBest}\`, VW - 20, top + 24, 12, close ? \`hsla(45,100%,70%,\${0.6 + 0.4 * Math.sin(time * 8)})\` : 'rgba(200,210,255,0.5)', 700, 'right');
    }
    if (combo >= 10) {
      const pulse = 1 + 0.08 * Math.sin(time * 10);
      neonText(\`COMBO x\${combo}\`, VW / 2, top + 46, 17 * pulse, tierHue(streakTier(combo)), 700);
    } else if (combo > 0) neonText(\`COMBO x\${combo}\`, VW / 2, top + 46, 15, 50, 700);

    // run coins (left), shield under it
    drawCoinIcon(26, top + 2, 9);
    plainText(String(Math.round(hudCoins)), 42, top + 3, 20, '#ffe9a6', 700, 'left');
    if (run && run.rush && run.planets < 20) plainText('2x', 26, top + 22, 12, '#ffd36b', 700, 'center');
    if (comet.shield) {
      drawShieldIcon(26, top + 44, 10, '#c9fbff');
      if (comet.shield > 1) plainText('x2', 42, top + 45, 14, '#c9fbff', 700, 'left');
    }
    plainText(\`LV \${levelOf(comet.planet ? comet.planet.idx : hops) + 1}\`, VW - 20, top + 4, 14, 'rgba(200,210,255,0.6)', 700, 'right');

    if (run && run.slowmo === 'ready') plainText('Slow-Mo ready: double-tap', VW / 2, VH - 26, 14, 'rgba(190,230,255,0.75)', 600);
    if (run && run.slowLeft > 0) neonText(\`SLOW-MO  \${run.slowLeft}\`, VW / 2, VH - 28, 16, 200);

    if (levelBanner > 0) {
      const a = Math.min(1, levelBanner * 2) * Math.min(1, (2.2 - levelBanner) * 4);
      const L = lastLevel;
      const note = L === 1 ? 'Faster orbits, smaller planets'
        : L === 2 ? 'Planets on the move'
        : L === 3 ? 'Watch for reverse spin'
        : L === 4 ? 'Black holes ahead'
        : 'Faster still';
      const ly = streakFx ? Math.max(VH * 0.38, 270) : VH * 0.36;
      neonText(\`LEVEL \${L + 1}\`, VW / 2, ly, 30, 300, 700, 'center', a);
      plainText(note, VW / 2, ly + 30, 15, '#e6dcff', 500, 'center', a);
    }
    if (missionBanner) {
      const a = Math.min(1, missionBanner.t * 2) * Math.min(1, (2.6 - missionBanner.t) * 5);
      neonText(missionBanner.text, VW / 2, top + 80, 18, 45, 700, 'center', a);
      plainText(missionBanner.sub, VW / 2, top + 102, 13, '#ffeec2', 500, 'center', a);
    }
  }

  function drawShockwaves() {
    ctx.globalCompositeOperation = 'lighter';
    for (const w of shockwaves) {
      const t = (w.life - w.delay) / w.dur;
      if (t < 0) continue;
      const e = 1 - Math.pow(1 - t, 3);
      const r = w.r + (w.max - w.r) * e;
      const a = 1 - t;
      ctx.lineWidth = w.w * 3 * a + 1;
      ctx.strokeStyle = \`hsla(\${w.hue},100%,60%,\${0.25 * a})\`;
      ctx.beginPath(); ctx.arc(w.x, w.y, r, 0, TAU); ctx.stroke();
      ctx.lineWidth = Math.max(1, w.w * a);
      ctx.strokeStyle = \`hsla(\${w.hue},100%,80%,\${0.9 * a})\`;
      ctx.beginPath(); ctx.arc(w.x, w.y, r, 0, TAU); ctx.stroke();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawStreakOverlay() {
    if (streakFlash) {
      const a = streakFlash.t / 0.45;
      const g = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.2, VW / 2, VH / 2, VH * 0.75);
      g.addColorStop(0, \`hsla(\${streakFlash.hue},100%,60%,0)\`);
      g.addColorStop(1, \`hsla(\${streakFlash.hue},100%,55%,\${0.45 * a})\`);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, VW, VH);
    }
    if (speedLines > 0) {
      // radial speed lines rushing out from the centre
      ctx.globalCompositeOperation = 'lighter';
      const cx = VW / 2, cy = VH * 0.42, n = 36;
      const h = streakFx ? tierHue(streakFx.tier) : 190;
      for (let i = 0; i < n; i++) {
        const a = i * TAU / n + (i % 3) * 0.05;
        const prog = (1 - speedLines) + ((i * 37) % 10) / 40;
        const r0 = 80 + prog * VH * 0.7, r1 = r0 + 60 + (i % 4) * 25;
        ctx.strokeStyle = \`hsla(\${h},100%,80%,\${0.5 * speedLines})\`;
        ctx.lineWidth = 1.5 + (i % 3);
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
        ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
        ctx.stroke();
      }
      ctx.globalCompositeOperation = 'source-over';
    }
    if (streakFx) {
      const { t, dur, tier } = streakFx;
      const h = tierHue(tier);
      // pop in with overshoot, hold, then drift up and fade
      const pin = Math.min(1, t / 0.35);
      const back = 1 + 2.2 * Math.pow(pin - 1, 3) + 1.2 * Math.pow(pin - 1, 2);
      const sc = 0.3 + 0.7 * back;
      const a = Math.min(1, t * 6) * Math.min(1, (dur - t) / 0.5);
      const y = Math.max(VH * 0.24, 178) - Math.max(0, t - dur + 0.6) * 40;
      ctx.save();
      ctx.translate(VW / 2, y);
      ctx.scale(sc, sc);
      ctx.rotate(Math.sin(t * 9) * 0.04 * Math.max(0, 1 - t));
      neonText(\`\${streakFx.combo} IN A ROW\`, 0, -34, 18, h, 700, 'center', a);
      const size = Math.min(56, 38 + tier * 4);
      // chromatic offset copies for a glitchy punch
      if (t < 0.6) {
        const o = (0.6 - t) * 10;
        ctx.globalCompositeOperation = 'lighter';
        plainText(streakFx.name, -o, 8, size, \`hsla(\${(h + 150) % 360},100%,60%,0.6)\`, 700, 'center', a);
        plainText(streakFx.name, o, 8, size, \`hsla(\${(h + 300) % 360},100%,60%,0.6)\`, 700, 'center', a);
        ctx.globalCompositeOperation = 'source-over';
      }
      neonText(streakFx.name, 0, 8, size, h, 700, 'center', a);
      ctx.restore();
    }
  }

  function render() {
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    drawBackground();

    const sx = shake ? rand(-shake, shake) : 0;
    const sy = shake ? rand(-shake, shake) : 0;
    ctx.save();
    ctx.translate(sx, -camY + sy);

    for (const h of holes) drawHole(h);
    for (const p of planets) drawPlanet(p);
    drawAimLine();
    for (const it of items) drawItem(it);
    drawShockwaves();
    drawParticles();
    drawComet();

    for (const t of texts) {
      const a = Math.min(1, t.life * 2);
      neonText(t.text, t.x, t.y, t.size, t.hue, 700, 'center', a);
    }
    ctx.restore();

    drawStreakOverlay();
    drawConfetti();
    drawHighScoreBanner();
    if (flash > 0) {
      ctx.fillStyle = \`rgba(120,240,255,\${flash * 0.35})\`;
      ctx.fillRect(0, 0, VW, VH);
    }
    drawHUD();
  }

  // ---------- Coin balance display (animated count-up) ----------
  let shownCoins = save.coins;
  let lastShown = -1;
  function tickCoinDisplay(dt) {
    if (shownCoins !== save.coins) {
      shownCoins += (save.coins - shownCoins) * ease(6, dt);
      if (Math.abs(save.coins - shownCoins) < 0.5) shownCoins = save.coins;
    }
    const v = Math.round(shownCoins);
    if (v !== lastShown) {
      lastShown = v;
      for (const el of $$('.bal')) el.textContent = v.toLocaleString();
    }
  }
  function bumpCoins() {
    for (const el of $$('.coins')) {
      el.classList.remove('pop');
      void el.offsetWidth;
      el.classList.add('pop');
    }
  }

  // ---------- Leaderboard ----------
  // "Everyone" uses the artifact's shared database when the page runs inside the Claude
  // viewer: scores/<viewer id> holds each player's best. Elsewhere only "My runs" (this device).
  const board = { db: null, user: null, myId: null, rows: [], myRemote: 0, ready: false, failed: false, readOnly: false, rank: null };
  let boardTab = 'everyone', boardReturn = 'menu';
  const BOARD_SIZE = 25;

  async function initBoard() {
    const use = window.claude && window.claude.use;
    if (!use) { board.failed = true; renderBoardIfOpen(); return; }
    let db = null, user = null;
    try { [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]); } catch (e) { db = null; }
    if (!db || !user) { board.failed = true; renderBoardIfOpen(); return; }
    board.db = db; board.user = user;
    board.myId = await user.id();
    if (board.myId) {
      try {
        const mine = await db.doc('scores/' + board.myId).get();
        board.myRemote = mine.exists ? (Number(mine.data().best) || 0) : 0;
      } catch (e) { /* treat as no remote score */ }
    }
    refreshRank();
    db.collection('scores').orderBy('best', 'desc').limit(BOARD_SIZE).onSnapshot(snap => {
      board.rows = snap.docs
        .map(d => ({ id: d.id, best: Math.floor(Number(d.data().best) || 0), planets: Math.floor(Number(d.data().planets) || 0) }))
        .filter(r => r.best > 0);
      board.ready = true;
      renderBoardIfOpen();
    }, () => { board.failed = true; renderBoardIfOpen(); });
    // carry a best made before the leaderboard existed (or offline) up to the board
    if (save.best > board.myRemote) postBest(save.best, save.best === score ? hops : 0);
  }

  let posting = false;
  async function postBest(best, planetsReached) {
    if (!board.db || !board.myId || board.readOnly || posting || best <= board.myRemote) return;
    posting = true;
    try {
      await board.db.doc('scores/' + board.myId).set({ best, planets: planetsReached, at: new Date().toISOString() });
      board.myRemote = best;
    } catch (e) {
      if (e && e.code === 'invalid_argument') board.readOnly = true;   // this viewer may only read
    }
    posting = false;
    await refreshRank();
  }

  async function refreshRank() {
    if (!board.db || !board.myRemote) { board.rank = null; return; }
    try {
      const above = await board.db.collection('scores').where('best', '>', board.myRemote).limit(1000).get();
      board.rank = above.size + 1;
    } catch (e) { board.rank = null; }
    if (screen === 'over') renderRankLine();
    renderBoardIfOpen();
  }

  function recordRun() {
    // My runs: top 10 on this device; a revive updates the same entry
    if (!run || score <= 0) return;
    const entry = { s: score, p: hops - run.startIdx, d: today(), id: run.recordId || (run.recordId = Date.now()) };
    save.runs = save.runs.filter(r => r.id !== entry.id).concat(entry).sort((a, b) => b.s - a.s).slice(0, 10);
  }

  function renderBoardIfOpen() { if (screen === 'board') renderBoard(); }

  function rowHtml(rank, avatar, name, sub, pts, me) {
    return \`<li class="row-entry\${me ? ' me' : ''}"><span class="rank">\${rank}</span>\${avatar}<span class="who"><b data-name></b><small>\${sub}</small></span><span class="pts">\${pts}</span></li>\`;
  }

  async function renderBoard() {
    for (const t of $$('[data-board]')) t.setAttribute('aria-selected', String(t.dataset.board === boardTab));
    const list = $('#board-list'), note = $('#board-note'), meBox = $('#board-me');
    meBox.hidden = true;
    if (boardTab === 'device') {
      note.textContent = 'Your 10 best runs on this device.';
      if (!save.runs.length) { list.innerHTML = '<li class="board-empty">No runs yet. Play a run and it shows up here.</li>'; return; }
      const runIcon = '<span class="dot"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 13l6-6 6 6M6 19l6-6 6 6"/></svg></span>';
      list.innerHTML = save.runs.map((r, i) => rowHtml(i + 1, runIcon, '', \`\${r.p} planets\`, r.s, false)).join('');
      $$('#board-list [data-name]').forEach((el, i) => { el.textContent = save.runs[i].d; });
      return;
    }
    if (board.failed) {
      note.textContent = '';
      list.innerHTML = '<li class="board-empty">The shared leaderboard works when you play from the game\\'s Claude link. Your own runs are under My runs.</li>';
      return;
    }
    if (!board.ready) { note.textContent = ''; list.innerHTML = '<li class="board-empty">Loading scores…</li>'; return; }
    note.textContent = board.readOnly ? 'You can view the leaderboard, but your scores can\\'t be posted from this link.' : 'Everyone playing this game. Your best run is posted when a run ends.';
    if (!board.rows.length) { list.innerHTML = '<li class="board-empty">No scores yet. Finish a run to claim the top spot.</li>'; return; }
    const ids = board.rows.map(r => r.id);
    if (board.myId && !ids.includes(board.myId)) ids.push(board.myId);
    const ps = await board.user.profiles(ids);
    if (screen !== 'board' || boardTab !== 'everyone') return;
    list.innerHTML = board.rows.map((r, i) => rowHtml(i + 1, '<img alt="" data-av>', '', \`\${r.planets} planets\`, r.best, r.id === board.myId)).join('');
    const names = $$('#board-list [data-name]'), avs = $$('#board-list [data-av]');
    board.rows.forEach((r, i) => {
      const p = ps[r.id] || {};
      names[i].textContent = r.id === board.myId ? \`\${p.name || 'You'} (you)\` : (p.name || 'Player');
      if (p.avatarUrl) avs[i].src = p.avatarUrl;
    });
    // pin my own row underneath when I'm outside the top list
    if (board.myId && board.myRemote > 0 && !board.rows.some(r => r.id === board.myId)) {
      const p = ps[board.myId] || {};
      meBox.innerHTML = \`<ol class="board">\${rowHtml(board.rank ? '#' + board.rank : '–', '<img alt="" data-av>', '', 'Your best', board.myRemote, true)}</ol>\`;
      meBox.querySelector('[data-name]').textContent = \`\${p.name || 'You'} (you)\`;
      if (p.avatarUrl) meBox.querySelector('[data-av]').src = p.avatarUrl;
      meBox.hidden = false;
    }
  }

  function renderRankLine() {
    const el = $('#over-rank');
    el.hidden = !board.rank;
    if (board.rank) el.textContent = board.rank === 1 ? 'You are #1 on the leaderboard!' : \`Leaderboard rank: #\${board.rank}\`;
  }

  // ---------- Screens ----------
  let shopTab = 'upgrades';
  let shopReturn = 'menu';
  let prerunPick = [];

  function showScreen(name) {
    screen = name;
    for (const el of $$('.screen')) el.hidden = el.id !== 'scr-' + name;
    if (name === 'menu') { renderMenu(); sfx.music.mode('menu'); }
    else if (name === 'shop') renderShop();
    else if (name === 'prerun') renderPrerun();
    else if (name === 'over') renderOver();
    else if (name === 'settings') renderSettings();
    else if (name === 'board') renderBoard();
    const el = name && $('#scr-' + name);
    if (el) el.scrollTop = 0;
  }

  const SOUND_ON = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
  const SOUND_OFF = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
  function renderSoundBtn() {
    const b = $('#btn-sound');
    b.innerHTML = save.sound ? SOUND_ON : SOUND_OFF;
    b.setAttribute('aria-pressed', String(save.sound));
    b.setAttribute('aria-label', save.sound ? 'Sound on' : 'Sound off');
  }

  function renderMenu() {
    renderSoundBtn();
    $('#menu-best').textContent = save.best;
    $('#mission-list').innerHTML = save.missions.map(m => {
      const def = MISSION_DEFS.find(d => d.type === m.type);
      const prog = Math.min(m.progress, m.target);
      return \`<li class="mission">
        <div class="m-top"><span>\${def.text(m.target)}</span><span class="reward"><i class="coin sm"></i>\${m.reward}</span></div>
        <div class="progress"><div style="width:\${(prog / m.target) * 100}%"></div></div>
        <div class="m-prog">\${prog} / \${m.target}\${def.scope === 'run' ? ' best' : ''}</div>
      </li>\`;
    }).join('');
  }

  function priceTag(price, disabled, extra = '') {
    return \`<button class="buy" type="button" \${extra} \${disabled ? 'disabled' : ''}><i class="coin sm"></i>\${price}</button>\`;
  }

  function renderShop() {
    for (const t of $$('[data-tab]')) t.setAttribute('aria-selected', String(t.dataset.tab === shopTab));
    let html = '';
    if (shopTab === 'upgrades') {
      html = UPGRADES.map(u => {
        const lvl = up(u.id);
        const max = lvl >= u.prices.length;
        const price = max ? 0 : u.prices[lvl];
        const poor = !max && save.coins < price;
        const pips = u.prices.map((_, i) => \`<i class="\${i < lvl ? 'on' : ''}"></i>\`).join('');
        const btn = max ? '<button class="buy equipped" type="button" disabled>MAX</button>' : priceTag(price, poor, \`data-buy="up:\${u.id}"\`);
        return \`<div class="card \${poor ? 'poor' : ''}"><div class="icon">\${svg(u.id)}</div>
          <div class="info"><h4>\${u.name}</h4><p>\${u.desc}</p><div class="pips" aria-label="Level \${lvl} of 5">\${pips}</div></div>\${btn}</div>\`;
      }).join('');
    } else if (shopTab === 'gadgets') {
      html = '<p class="hint">One-use items. Equip up to 2 on the loadout screen before a run.</p>' + GADGETS.map(g => {
        const poor = save.coins < g.price;
        return \`<div class="card \${poor ? 'poor' : ''}"><div class="icon">\${svg(g.id)}</div>
          <div class="info"><h4>\${g.name}</h4><p>\${g.desc}</p><div class="owned">OWNED: \${save.gadgets[g.id]}</div></div>\${priceTag(g.price, poor, \`data-buy="gd:\${g.id}"\`)}</div>\`;
      }).join('');
    } else {
      html = '<p class="hint">Cosmetic only. Buy once, then equip any time.</p>' + LOOK_GROUPS.map(([group, title]) => {
        const cards = LOOKS[group].map(l => {
          const key = \`\${group}:\${l.id}\`;
          const owned = save.looks.owned.includes(key);
          const equipped = save.looks.equipped[group] === l.id;
          const poor = !owned && save.coins < l.price;
          let btn;
          if (equipped) btn = '<button class="buy equipped" type="button" disabled>EQUIPPED</button>';
          else if (owned) btn = \`<button class="buy equip" type="button" data-equip="\${key}">EQUIP</button>\`;
          else btn = priceTag(l.price, poor, \`data-buy="lk:\${key}"\`);
          return \`<div class="card \${poor ? 'poor' : ''}"><div class="icon">\${swatch(group, l)}</div>
            <div class="info"><h4>\${l.name}</h4><p>\${owned ? 'Owned' : l.price ? 'Not owned' : 'Free'}</p></div>\${btn}</div>\`;
        }).join('');
        return \`<h3 class="label">\${title}</h3>\${cards}\`;
      }).join('');
    }
    $('#shop-list').innerHTML = html;
  }

  function swatch(group, l) {
    if (group === 'comet') {
      const bg = l.hue < 0
        ? 'radial-gradient(circle, #fff 0 18%, transparent 46%), conic-gradient(hsl(0,100%,60%), hsl(90,100%,60%), hsl(190,100%,60%), hsl(280,100%,65%), hsl(0,100%,60%))'
        : \`radial-gradient(circle, #fff 0 18%, hsl(\${l.hue},100%,62%) 36%, hsla(\${l.hue},100%,50%,0.25) 60%, transparent 72%)\`;
      return \`<span class="swatch" style="background:\${bg}"></span>\`;
    }
    if (group === 'planet') {
      const cols = [1, 2, 3].map(i => { const [h, s] = PLANET_THEMES[l.id](i); return \`hsl(\${h},\${s * 0.8}%,55%)\`; });
      return \`<span class="swatch" style="background:radial-gradient(circle at 30% 35%, \${cols[0]} 0 26%, transparent 27%), radial-gradient(circle at 70% 40%, \${cols[1]} 0 20%, transparent 21%), radial-gradient(circle at 48% 75%, \${cols[2]} 0 18%, transparent 19%)"></span>\`;
    }
    return \`<span class="swatch" style="border-radius:8px;height:14px;width:44px;background:\${TRAIL_SWATCH[l.id]}"></span>\`;
  }

  function itemInfo(key) {
    const [kind, a, b] = key.split(':');
    if (kind === 'up') {
      const u = UPGRADES.find(x => x.id === a);
      const lvl = up(a);
      return { price: lvl >= u.prices.length ? Infinity : u.prices[lvl], label: \`\${u.name} level \${lvl + 1}\` };
    }
    if (kind === 'gd') {
      const g = GADGETS.find(x => x.id === a);
      return { price: g.price, label: g.name };
    }
    const l = LOOKS[a].find(x => x.id === b);
    return { price: l.price, label: l.name };
  }

  function requestBuy(key) {
    const { price, label } = itemInfo(key);
    if (!(save.coins >= price)) return;
    if (price > 200) confirmBuy(\`Buy \${label} for \${price} coins?\`, () => buy(key));
    else buy(key);
  }

  function buy(key) {
    const { price, label } = itemInfo(key);
    if (!(save.coins >= price)) return;
    save.coins -= price;
    const [kind, a, b] = key.split(':');
    if (kind === 'up') save.upgrades[a] = up(a) + 1;
    else if (kind === 'gd') save.gadgets[a] = (save.gadgets[a] || 0) + 1;
    else {
      if (!save.looks.owned.includes(\`\${a}:\${b}\`)) save.looks.owned.push(\`\${a}:\${b}\`);
      equip(a, b);
    }
    persist();
    renderShop();
    toast(\`Bought \${label}\`);
    sfx.purchase();
  }

  function equip(group, id) {
    save.looks.equipped[group] = id;
    if (group === 'planet') {
      for (const p of planets) [p.hue, p.sat] = PLANET_THEMES[id](p.idx);
    }
    ribbon = [];
    persist();
  }

  let modalAction = null;
  function confirmBuy(text, onOk) {
    $('#modal-text').textContent = text;
    modalAction = onOk;
    $('#modal').hidden = false;
    $('#modal-ok').focus();
  }
  function closeModal() { $('#modal').hidden = true; modalAction = null; }

  let toastTimer = 0;
  function toast(msg) {
    const el = $('#toast');
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, 1600);
  }

  function ownedGadgets() { return GADGETS.filter(g => save.gadgets[g.id] > 0); }

  function renderPrerun() {
    const owned = ownedGadgets();
    prerunPick = prerunPick.filter(id => save.gadgets[id] > 0).slice(0, 2);
    $('#loadout-grid').innerHTML = owned.map(g => \`
      <button class="tile" type="button" data-pick="\${g.id}" aria-pressed="\${prerunPick.includes(g.id)}">
        <span class="icon">\${svg(g.id)}</span><b>\${g.name}</b><small>\${g.desc}</small><span class="owned">x\${save.gadgets[g.id]}</span>
      </button>\`).join('');
    $('#loadout-count').textContent = \`\${prerunPick.length} / 2 selected\`;
  }

  function renderOver() {
    $('#over-score').textContent = score;
    $('#over-best').textContent = save.best;
    $('#over-newbest').hidden = !newBest;
    $('#scr-over').classList.toggle('celebrate', newBest);
    if (newBest && run) $('#over-beat').textContent = run.prevBest > 0 ? \`Old best \${run.prevBest} · beaten by \${score - run.prevBest}\` : 'First score on the board';
    const c = run ? run.coins : { path: 0, milestone: 0, combo: 0, score: 0, daily: 0, missions: 0 };
    const rows = [
      ['Coins picked up', c.path],
      ['Every 5 planets', c.milestone],
      ['Combo bonuses', c.combo],
      ['Score bonus (10%)', c.score],
      ['First run today', c.daily],
      ['Missions', c.missions],
    ];
    $('#breakdown').innerHTML = rows.map(([k, v]) => \`<li class="\${v ? '' : 'zero'}"><span>\${k}</span><b>+\${v}</b></li>\`).join('');
    $('#over-total').textContent = rows.reduce((s, r) => s + r[1], 0);
    renderRankLine();
    $('#btn-revive').hidden = !(run && run.revive && !run.reviveUsed && save.gadgets.revive > 0);
    const actions = $('#over-actions');
    actions.classList.add('locked');
    setTimeout(() => actions.classList.remove('locked'), 600);
    bumpCoins();
  }

  // ---------- Run flow ----------
  function goPlay() {
    if (ownedGadgets().length) {
      prerunPick = save.loadout.slice();
      showScreen('prerun');
    } else {
      startRun([]);
    }
  }

  function startRun(pick) {
    const lo = pick.filter(id => save.gadgets[id] > 0).slice(0, 2);
    for (const id of lo) if (id !== 'revive') save.gadgets[id]--;
    save.loadout = lo;
    run = {
      startIdx: lo.includes('head') ? 10 : 0,
      aim: lo.includes('aim'),
      slowmo: lo.includes('slowmo') ? 'ready' : 'none',
      slowLeft: 0,
      rush: lo.includes('rush'),
      revive: lo.includes('revive'),
      reviveUsed: false,
      planets: 0,
      lastTap: 0,
      coins: { path: 0, milestone: 0, combo: 0, score: 0, daily: 0, missions: 0 },
      committed: 0,
      dailyGiven: false,
      prevBest: save.best,
      beatBest: false,
    };
    reset({ head: lo.includes('head') });
    state = 'play';
    showScreen(null);
    sfx.music.mode('run');
    missionTrack('runs', 1);
    persist();
  }

  function revive() {
    if (!run || run.reviveUsed || save.gadgets.revive <= 0) return;
    save.gadgets.revive--;
    run.reviveUsed = true;
    persist();
    const p = comet.launchedFrom || comet.planet || planets[0];
    respawnAt(p);
    camY = targetCamY();
    state = 'play';
    newBest = false;
    showScreen(null);
    flash = 0.6;
    burst(comet.x, comet.y, 45, 30, 200, 0.8, 4);
    floatText(p.x, p.y - p.ring - 10, 'REVIVED', 45, 20);
    sfx.revive();
    sfx.music.mode('run');
  }

  function toMenu() {
    run = null;
    reset();
    state = 'start';
    showScreen('menu');
  }

  // ---------- UI events ----------
  $('#btn-play').addEventListener('click', goPlay);
  $('#btn-again').addEventListener('click', goPlay);
  $('#btn-menu').addEventListener('click', toMenu);
  $('#btn-revive').addEventListener('click', revive);
  $('#btn-launch').addEventListener('click', () => startRun(prerunPick));
  for (const b of $$('[data-open-shop]')) b.addEventListener('click', () => { shopReturn = screen; showScreen('shop'); });
  for (const b of $$('[data-back]')) b.addEventListener('click', () => {
    if (screen === 'shop') showScreen(shopReturn);
    else if (screen === 'board') showScreen(boardReturn);
    else showScreen(state === 'over' ? 'over' : 'menu');
  });
  for (const b of $$('[data-open-board]')) b.addEventListener('click', () => { boardReturn = screen; showScreen('board'); });
  for (const t of $$('[data-board]')) t.addEventListener('click', () => { boardTab = t.dataset.board; renderBoard(); });
  for (const t of $$('[data-tab]')) t.addEventListener('click', () => { shopTab = t.dataset.tab; renderShop(); $('#scr-shop').scrollTop = 0; });
  $('#shop-list').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b || b.disabled) return;
    if (b.dataset.buy) requestBuy(b.dataset.buy);
    else if (b.dataset.equip) {
      const [g, id] = b.dataset.equip.split(':');
      equip(g, id);
      renderShop();
    }
  });
  $('#loadout-grid').addEventListener('click', e => {
    const b = e.target.closest('[data-pick]');
    if (!b) return;
    const id = b.dataset.pick;
    if (prerunPick.includes(id)) prerunPick = prerunPick.filter(x => x !== id);
    else if (prerunPick.length >= 2) { toast('Max 2 gadgets per run'); return; }
    else prerunPick.push(id);
    renderPrerun();
  });
  $('#modal-cancel').addEventListener('click', closeModal);
  $('#modal-ok').addEventListener('click', () => { const fn = modalAction; closeModal(); if (fn) fn(); });
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

  $('#btn-sound').addEventListener('click', () => {
    save.sound = !save.sound;
    persist();
    renderSoundBtn();
    if (save.sound) { sfx.click(); sfx.music.mode(sfx.music.current() || 'menu'); }
    else sfx.music.mode(null);
  });
  // ---------- Volume settings ----------
  function renderSettings() {
    for (const [id, key] of [['vol-sfx', 'sfxVol'], ['vol-music', 'musicVol']]) {
      const el = $('#' + id);
      const pct = Math.round(save[key] * 100);
      el.value = pct;
      el.disabled = !save.sound;
      el.style.setProperty('--fill', pct + '%');
      $('#' + id + '-val').textContent = pct === 0 ? 'Off' : pct + '%';
    }
    $('#settings-note').textContent = save.sound
      ? 'Set music to 0% to turn it off. The speaker button on the start screen mutes everything.'
      : 'Sound is muted. Turn it back on with the speaker button on the start screen.';
  }
  let volSaveTimer = 0;
  for (const [id, key] of [['vol-sfx', 'sfxVol'], ['vol-music', 'musicVol']]) {
    $('#' + id).addEventListener('input', e => {
      save[key] = clamp(+e.target.value / 100, 0, 1);
      renderSettings();
      sfx.music.volumes();
      clearTimeout(volSaveTimer);
      volSaveTimer = setTimeout(persist, 300);
    });
  }
  // a short preview at the new effects level when the slider is released
  $('#vol-sfx').addEventListener('change', () => sfx.star());
  $('#btn-settings').addEventListener('click', () => showScreen('settings'));

  document.addEventListener('click', e => {
    const b = e.target.closest('button');
    if (b && !b.disabled && b.id !== 'btn-sound' && !b.dataset.buy) sfx.click();
  });
  // buy buttons click too (purchase sound follows if it goes through)
  $('#shop-list').addEventListener('pointerdown', e => { const b = e.target.closest('[data-buy]'); if (b && !b.disabled) sfx.click(); });

  // Hidden debug: tap the title 5 times quickly for +1000 coins
  let titleTaps = [];
  $('#title').addEventListener('click', () => {
    const now = performance.now();
    titleTaps = titleTaps.filter(t => now - t < 2500);
    titleTaps.push(now);
    if (titleTaps.length >= 5) {
      titleTaps = [];
      save.coins += 1000;
      persist();
      bumpCoins();
      toast('Debug: +1000 coins');
      sfx.purchase();
    }
  });

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    let scaled = dt;
    if (warp > 0) {
      warp = Math.max(0, warp - dt);
      scaled = dt * (0.3 + 0.7 * Math.pow(1 - warp / WARP_TIME, 2));
    }
    update(scaled);
    render();
    requestAnimationFrame(frame);
  }
  document.addEventListener('visibilitychange', () => {
    last = performance.now();
    sfx.suspend(document.hidden);
  });

  sfx.music.follow(() => combo);
  initBoard();
  resize();
  reset();
  showScreen('menu');
  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
})();
<\/script>
</body>
