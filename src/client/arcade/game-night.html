<html lang="en">
<head>
<meta charset="utf-8">
<title>Orbit Hop</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05040d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
  /* Full-bleed canvas for play; menus are DOM overlays on top. Deliberately dark-only neon arcade look. */
  :root {
    --void: #05040d;
    --panel: rgba(12, 9, 34, 0.82);
    --line: rgba(120, 220, 255, 0.22);
    --text: #e8ebff;
    --muted: #9aa2d6;
    --cyan: hsl(190, 100%, 62%);
    --pink: hsl(312, 100%, 70%);
    --gold: hsl(45, 100%, 60%);
    --gold-deep: hsl(36, 100%, 45%);
    --ink: #04121a;
    --font: "Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--void);
    color: var(--text);
    font-family: var(--font);
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    outline: none;
  }

  /* ---------- Overlay screens ---------- */
  .screen {
    position: fixed;
    inset: 0;
    z-index: 2;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    overscroll-behavior: contain;
    background: radial-gradient(ellipse at 50% 30%, rgba(5, 4, 13, 0.35), rgba(5, 4, 13, 0.82) 70%);
    padding-top: max(14px, env(safe-area-inset-top, 0px));
    padding-bottom: max(18px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }
  .wrap {
    max-width: 440px;
    min-height: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    min-height: 48px;
  }
  .bar h2 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 0.14em;
    color: var(--cyan);
    text-shadow: 0 0 14px hsla(190, 100%, 60%, 0.6);
  }
  .label {
    font-size: 12px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 700;
  }
  .bar-right { display: flex; align-items: center; gap: 10px; }
  #btn-settings svg, #btn-sound svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #btn-sound[aria-pressed="false"] { color: var(--muted); }
  #btn-sound[aria-pressed="false"] svg { opacity: 0.5; }
  .best b { color: var(--gold); font-size: 18px; margin-left: 6px; font-variant-numeric: tabular-nums; }

  .coins {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px 8px 10px;
    border-radius: 999px;
    background: rgba(40, 28, 4, 0.75);
    border: 1px solid hsla(45, 100%, 60%, 0.45);
    box-shadow: 0 0 16px hsla(45, 100%, 55%, 0.18);
    font-weight: 700;
    font-size: 18px;
    color: #ffe9a6;
    font-variant-numeric: tabular-nums;
  }
  .coins.pop { animation: pop 0.35s ease-out; }
  @keyframes pop {
    0% { transform: scale(1); }
    40% { transform: scale(1.18); box-shadow: 0 0 28px hsla(45, 100%, 60%, 0.6); }
    100% { transform: scale(1); }
  }
  .coin {
    display: inline-block;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    flex: none;
    background: radial-gradient(circle at 35% 30%, #fff6c8 0 18%, var(--gold) 40%, var(--gold-deep) 100%);
    box-shadow: inset 0 0 0 2px hsla(40, 100%, 80%, 0.55), 0 0 8px hsla(45, 100%, 60%, 0.6);
  }
  .coin.sm { width: 13px; height: 13px; }

  .title {
    margin: 4px 0 0;
    text-align: center;
    line-height: 0.92;
    font-size: clamp(56px, 19vw, 84px);
    font-weight: 700;
    letter-spacing: 0.04em;
    cursor: default;
  }
  .title span { display: block; }
  .title span:first-child { color: #c9f6ff; text-shadow: 0 0 18px hsla(190, 100%, 60%, 0.9), 0 0 42px hsla(190, 100%, 60%, 0.45); }
  .title span:last-child { color: #ffd0f4; text-shadow: 0 0 18px hsla(312, 100%, 65%, 0.9), 0 0 42px hsla(312, 100%, 60%, 0.45); }
  .tagline { margin: 0; text-align: center; color: var(--muted); font-size: 15px; line-height: 1.45; text-wrap: balance; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px;
  }
  .panel h3 { margin: 0 0 10px; }

  .missions ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .mission .m-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 15px; font-weight: 600; }
  .mission .reward { display: inline-flex; align-items: center; gap: 5px; color: #ffe08a; font-weight: 700; white-space: nowrap; }
  .progress { position: relative; height: 8px; margin-top: 7px; border-radius: 6px; background: rgba(120, 140, 255, 0.14); overflow: hidden; }
  .progress > div { height: 100%; border-radius: 6px; background: linear-gradient(90deg, var(--cyan), var(--pink)); box-shadow: 0 0 10px hsla(190, 100%, 60%, 0.6); transition: width 0.5s; }
  .mission .m-prog { margin-top: 4px; font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }

  .actions { display: flex; flex-direction: column; gap: 10px; margin-top: auto; padding-top: 6px; }
  .actions.locked { pointer-events: none; opacity: 0.6; }
  .btn {
    appearance: none;
    font: 700 19px/1 var(--font);
    letter-spacing: 0.12em;
    min-height: 58px;
    padding: 0 20px;
    border-radius: 14px;
    border: 1.5px solid hsla(190, 100%, 62%, 0.6);
    background: rgba(8, 24, 40, 0.75);
    color: #cfefff;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.08s, box-shadow 0.2s;
  }
  .btn:active { transform: scale(0.97); }
  .btn:focus-visible, .buy:focus-visible, .tab:focus-visible, .tile:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .btn.primary {
    background: var(--cyan);
    color: var(--ink);
    border-color: transparent;
    box-shadow: 0 0 26px hsla(190, 100%, 60%, 0.55);
    min-height: 66px;
    font-size: 23px;
  }
  .btn.gold { background: var(--gold); color: #2a1a00; border-color: transparent; box-shadow: 0 0 22px hsla(45, 100%, 55%, 0.5); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .icon-btn {
    appearance: none;
    width: 48px;
    height: 48px;
    border-radius: 12px;
    border: 1.5px solid var(--line);
    background: rgba(10, 8, 30, 0.7);
    color: var(--text);
    font: 700 22px/1 var(--font);
    cursor: pointer;
    touch-action: manipulation;
    display: grid;
    place-items: center;
  }

  /* ---------- Shop ---------- */
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 4px; border-radius: 14px; background: rgba(10, 8, 30, 0.8); border: 1px solid var(--line); }
  .tab {
    appearance: none;
    min-height: 46px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    font: 700 15px/1 var(--font);
    letter-spacing: 0.1em;
    cursor: pointer;
    touch-action: manipulation;
  }
  .tab[aria-selected="true"] { background: hsla(190, 100%, 60%, 0.16); color: #d6f7ff; box-shadow: inset 0 0 0 1px hsla(190, 100%, 60%, 0.5); }
  .list { display: flex; flex-direction: column; gap: 10px; padding-bottom: 8px; }
  .list h3 { margin: 10px 2px 0; }
  .card {
    display: grid;
    grid-template-columns: 52px 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border-radius: 14px;
    background: var(--panel);
    border: 1px solid var(--line);
  }
  .card .info { min-width: 0; }
  .card h4 { margin: 0; font-size: 17px; letter-spacing: 0.02em; }
  .card p { margin: 3px 0 0; font-size: 13px; line-height: 1.35; color: var(--muted); }
  .card.poor .icon, .card.poor .info { opacity: 0.45; }
  .icon {
    width: 52px;
    height: 52px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    background: rgba(120, 220, 255, 0.08);
    color: var(--cyan);
  }
  .icon svg { width: 30px; height: 30px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .swatch { width: 38px; height: 38px; border-radius: 50%; }
  .pips { display: flex; gap: 5px; margin-top: 7px; }
  .pips i { width: 16px; height: 6px; border-radius: 3px; background: rgba(150, 160, 230, 0.22); }
  .pips i.on { background: var(--cyan); box-shadow: 0 0 8px hsla(190, 100%, 60%, 0.7); }
  .owned { margin-top: 5px; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #ffe08a; }
  .buy {
    appearance: none;
    min-width: 84px;
    min-height: 48px;
    padding: 0 12px;
    border-radius: 12px;
    border: 0;
    background: var(--gold);
    color: #2a1a00;
    font: 700 16px/1 var(--font);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    touch-action: manipulation;
    font-variant-numeric: tabular-nums;
  }
  .buy:disabled { background: rgba(120, 120, 150, 0.22); color: rgba(220, 220, 240, 0.45); cursor: default; }
  .buy:disabled .coin { filter: grayscale(1); opacity: 0.6; }
  .buy.equip { background: transparent; border: 1.5px solid var(--cyan); color: #d6f7ff; }
  .buy.equipped { background: hsla(190, 100%, 60%, 0.18); color: var(--cyan); border: 0; }

  /* ---------- Pre-run ---------- */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
  .tile {
    appearance: none;
    text-align: left;
    padding: 12px;
    min-height: 120px;
    border-radius: 14px;
    border: 1.5px solid var(--line);
    background: var(--panel);
    color: var(--text);
    font: inherit;
    display: flex;
    flex-direction: column;
    gap: 6px;
    cursor: pointer;
    touch-action: manipulation;
  }
  .tile .icon { width: 42px; height: 42px; }
  .tile b { font-size: 16px; }
  .tile small { color: var(--muted); font-size: 12px; line-height: 1.3; }
  .tile[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 18px hsla(45, 100%, 55%, 0.35); background: rgba(40, 28, 4, 0.75); }
  .tile[aria-pressed="true"] .icon { color: var(--gold); }
  .hint { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.4; }

  /* ---------- Game over ---------- */
  .over-title { margin: 8px 0 0; text-align: center; font-size: clamp(42px, 13vw, 58px); color: #ffd2dc; text-shadow: 0 0 18px hsla(350, 100%, 60%, 0.9); letter-spacing: 0.06em; }
  .scores { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: center; }
  .scores .big { font-size: 46px; font-weight: 700; color: #d6f7ff; text-shadow: 0 0 16px hsla(190, 100%, 60%, 0.7); font-variant-numeric: tabular-nums; }
  .scores .big.gold { color: #ffe9a6; text-shadow: 0 0 16px hsla(45, 100%, 55%, 0.7); }
  .newbest { display: flex; flex-direction: column; align-items: center; gap: 4px; margin: -4px 0 0; animation: nb-in 0.7s cubic-bezier(.2,1.6,.4,1) both; }
  .nb-title {
    font-size: clamp(28px, 9vw, 38px);
    font-weight: 700;
    letter-spacing: 0.08em;
    background: linear-gradient(100deg, #ffb300 0%, #fff6c8 22%, #ffd54a 40%, #ff8a00 60%, #fff6c8 78%, #ffb300 100%);
    background-size: 220% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 12px hsla(45, 100%, 55%, 0.75));
    animation: shimmer 1.6s linear infinite;
  }
  .nb-sub { font-size: 14px; color: #ffe9a6; letter-spacing: 0.06em; }
  @keyframes shimmer { from { background-position: 220% 0; } to { background-position: 0 0; } }
  @keyframes nb-in { from { transform: scale(0.3) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
  .celebrate .scores .big.gold { animation: best-pop 0.9s 0.2s cubic-bezier(.2,1.8,.4,1) both; }
  @keyframes best-pop { from { transform: scale(0.4); } to { transform: none; } }
  @keyframes blink { from { opacity: 0.55; } to { opacity: 1; } }
  .breakdown ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
  .breakdown li { display: flex; justify-content: space-between; font-size: 15px; font-variant-numeric: tabular-nums; }
  .breakdown li.zero { opacity: 0.4; }
  .breakdown li b { color: #ffe08a; }
  .breakdown .total { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-weight: 700; font-size: 18px; }
  .breakdown .total span:last-child { display: inline-flex; align-items: center; gap: 6px; color: #ffe9a6; }
  .center { display: flex; justify-content: center; }

  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .row3 .btn { padding: 0 8px; font-size: 16px; letter-spacing: 0.08em; }
  .tabs.two { grid-template-columns: repeat(2, 1fr); }
  .rank-line { margin: -4px 0 0; text-align: center; font-weight: 700; letter-spacing: 0.08em; color: #d6f7ff; }

  /* ---------- Leaderboard ---------- */
  .board { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .row-entry {
    display: grid;
    grid-template-columns: 34px 32px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
  }
  .row-entry .rank { font-weight: 700; font-size: 18px; color: var(--muted); text-align: center; }
  .row-entry:nth-child(1) .rank { color: #ffd54a; text-shadow: 0 0 10px hsla(45, 100%, 55%, 0.7); }
  .row-entry:nth-child(2) .rank { color: #dfe6ff; }
  .row-entry:nth-child(3) .rank { color: #ffae6b; }
  .row-entry img, .row-entry .dot { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
  .row-entry .dot { display: grid; place-items: center; background: rgba(120, 220, 255, 0.12); color: var(--cyan); font-weight: 700; font-size: 13px; }
  .row-entry .who { min-width: 0; }
  .row-entry .who b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 16px; }
  .row-entry .who small { color: var(--muted); font-size: 12px; }
  .row-entry .pts { font-size: 22px; font-weight: 700; color: #d6f7ff; }
  .row-entry.me { border-color: var(--gold); box-shadow: 0 0 16px hsla(45, 100%, 55%, 0.25); background: rgba(40, 28, 4, 0.75); }
  .row-entry.me .pts { color: #ffe9a6; }
  .me-row { margin-top: 2px; }
  .board-empty { background: var(--panel); padding: 22px 14px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 14px; line-height: 1.45; }

  /* ---------- Settings ---------- */
  .sliders { display: flex; flex-direction: column; gap: 22px; padding: 18px 16px; }
  .slider { display: flex; flex-direction: column; gap: 12px; }
  .slider-top { display: flex; justify-content: space-between; font-size: 17px; font-weight: 600; }
  .slider-top b { color: var(--cyan); font-variant-numeric: tabular-nums; }
  .slider input {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 36px;
    margin: 0;
    background: transparent;
    touch-action: pan-y;
    cursor: pointer;
  }
  .slider input::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--cyan) var(--fill, 50%), rgba(120, 140, 255, 0.18) var(--fill, 50%)); }
  .slider input::-moz-range-track { height: 8px; border-radius: 4px; background: rgba(120, 140, 255, 0.18); }
  .slider input::-moz-range-progress { height: 8px; border-radius: 4px; background: var(--cyan); }
  .slider input::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; margin-top: -11px; border-radius: 50%; background: #fff; border: 3px solid var(--cyan); box-shadow: 0 0 14px hsla(190, 100%, 60%, 0.7); }
  .slider input::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 3px solid var(--cyan); box-shadow: 0 0 14px hsla(190, 100%, 60%, 0.7); }
  .slider input:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; border-radius: 8px; }
  .slider input:disabled { opacity: 0.4; }

  /* ---------- Modal & toast ---------- */
  .modal { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: 16px; background: rgba(2, 1, 8, 0.7); }
  .dialog { width: min(340px, 100%); padding: 20px; border-radius: 18px; background: #0d0a26; border: 1px solid hsla(45, 100%, 60%, 0.5); box-shadow: 0 0 40px hsla(45, 100%, 55%, 0.2); display: flex; flex-direction: column; gap: 16px; }
  .dialog p { margin: 0; font-size: 18px; line-height: 1.4; text-align: center; text-wrap: balance; }
  .toast {
    position: fixed;
    z-index: 6;
    left: 50%;
    top: max(16px, env(safe-area-inset-top, 0px));
    transform: translateX(-50%);
    padding: 12px 18px;
    border-radius: 12px;
    background: #0d0a26;
    border: 1px solid hsla(190, 100%, 60%, 0.5);
    font-weight: 700;
    white-space: nowrap;
    box-shadow: 0 0 24px hsla(190, 100%, 60%, 0.3);
    pointer-events: none;
  }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) {
    .coins.pop, .newbest, .nb-title, .celebrate .scores .big.gold { animation: none; }
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Orbit Hop game. Tap or press space to launch the comet."></canvas>

\x3C!-- Start screen -->
<section id="scr-menu" class="screen" hidden>
  <div class="wrap">
    <div class="bar">
      <div class="label best">Best<b id="menu-best">0</b></div>
      <div class="bar-right">
        <button class="icon-btn" type="button" id="btn-settings" aria-label="Sound settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg></button>
        <button class="icon-btn" type="button" id="btn-sound" aria-label="Sound on" aria-pressed="true"></button>
        <div class="coins"><i class="coin"></i><span class="bal">0</span></div>
      </div>
    </div>
    <h1 class="title" id="title"><span>ORBIT</span><span>HOP</span></h1>
    <p class="tagline">Tap to launch along your orbit. Hit the next ring to be captured. Land in the inner half to build a combo.</p>
    <div class="panel missions">
      <h3 class="label">Missions</h3>
      <ul id="mission-list"></ul>
    </div>
    <div class="actions">
      <button class="btn primary" id="btn-play" type="button">PLAY</button>
      <div class="row2">
        <button class="btn" type="button" data-open-shop>SHOP</button>
        <button class="btn" type="button" data-open-board>RANKS</button>
      </div>
    </div>
  </div>
</section>

\x3C!-- Pre-run loadout -->
<section id="scr-prerun" class="screen" hidden>
  <div class="wrap">
    <div class="bar">
      <button class="icon-btn" type="button" data-back aria-label="Back">&lsaquo;</button>
      <h2>LOADOUT</h2>
      <div class="coins"><i class="coin"></i><span class="bal">0</span></div>
    </div>
    <p class="hint">Pick up to 2 gadgets for this run. Gadgets are used up when the run starts, except Revive Token, which is only spent if you revive.</p>
    <div class="label" id="loadout-count">0 / 2 selected</div>
    <div class="grid" id="loadout-grid"></div>
    <div class="actions">
      <button class="btn primary" id="btn-launch" type="button">LAUNCH</button>
    </div>
  </div>
</section>

\x3C!-- Shop -->
<section id="scr-shop" class="screen" hidden>
  <div class="wrap">
    <div class="bar">
      <button class="icon-btn" type="button" data-back aria-label="Back">&lsaquo;</button>
      <h2>SHOP</h2>
      <div class="coins"><i class="coin"></i><span class="bal">0</span></div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" type="button" data-tab="upgrades">UPGRADES</button>
      <button class="tab" role="tab" type="button" data-tab="gadgets">GADGETS</button>
      <button class="tab" role="tab" type="button" data-tab="looks">LOOKS</button>
    </nav>
    <div class="list" id="shop-list"></div>
  </div>
</section>

\x3C!-- Leaderboard -->
<section id="scr-board" class="screen" hidden>
  <div class="wrap">
    <div class="bar">
      <button class="icon-btn" type="button" data-back aria-label="Back">&lsaquo;</button>
      <h2>RANKS</h2>
      <div class="coins"><i class="coin"></i><span class="bal">0</span></div>
    </div>
    <nav class="tabs two" role="tablist">
      <button class="tab" role="tab" type="button" data-board="everyone">EVERYONE</button>
      <button class="tab" role="tab" type="button" data-board="device">MY RUNS</button>
    </nav>
    <p class="hint" id="board-note"></p>
    <ol class="board" id="board-list"></ol>
    <div class="board me-row" id="board-me" hidden></div>
  </div>
</section>

\x3C!-- Settings -->
<section id="scr-settings" class="screen" hidden>
  <div class="wrap">
    <div class="bar">
      <button class="icon-btn" type="button" data-back aria-label="Back">&lsaquo;</button>
      <h2>SOUND</h2>
      <div class="coins"><i class="coin"></i><span class="bal">0</span></div>
    </div>
    <div class="panel sliders">
      <label class="slider" for="vol-sfx">
        <span class="slider-top"><span>Sound effects</span><b id="vol-sfx-val">80%</b></span>
        <input type="range" id="vol-sfx" min="0" max="100" step="5" value="80">
      </label>
      <label class="slider" for="vol-music">
        <span class="slider-top"><span>Music</span><b id="vol-music-val">60%</b></span>
        <input type="range" id="vol-music" min="0" max="100" step="5" value="60">
      </label>
    </div>
    <p class="hint" id="settings-note">Set music to 0% to turn it off. The speaker button on the start screen mutes everything.</p>
  </div>
</section>

\x3C!-- Game over -->
<section id="scr-over" class="screen" hidden>
  <div class="wrap">
    <div class="bar">
      <span></span>
      <div class="coins"><i class="coin"></i><span class="bal">0</span></div>
    </div>
    <h1 class="over-title">GAME OVER</h1>
    <div class="scores">
      <div><div class="label">Score</div><div class="big" id="over-score">0</div></div>
      <div><div class="label">Best</div><div class="big gold" id="over-best">0</div></div>
    </div>
    <div class="newbest" id="over-newbest" hidden><span class="nb-title">NEW HIGH SCORE</span><span class="nb-sub" id="over-beat"></span></div>
    <div class="panel breakdown">
      <h3 class="label">Coins this run</h3>
      <ul id="breakdown"></ul>
      <div class="total"><span>Total</span><span><i class="coin"></i><span id="over-total">0</span></span></div>
    </div>
    <p class="rank-line" id="over-rank" hidden></p>
    <div class="actions" id="over-actions">
      <button class="btn gold" id="btn-revive" type="button" hidden>REVIVE (TOKEN)</button>
      <button class="btn primary" id="btn-again" type="button">PLAY AGAIN</button>
      <div class="row3">
        <button class="btn" type="button" data-open-shop>SHOP</button>
        <button class="btn" type="button" data-open-board>RANKS</button>
        <button class="btn" type="button" id="btn-menu">MENU</button>
      </div>
    </div>
  </div>
</section>

<div class="modal" id="modal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-text">
    <p id="modal-text"></p>
    <div class="row2">
      <button class="btn" type="button" id="modal-cancel">CANCEL</button>
      <button class="btn gold" type="button" id="modal-ok">BUY</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  'use strict';

  // ---------- Setup ----------
  // Game Night embed: when loaded with ?embed, report the first finished run's score to the host page.
  const EMBED = new URLSearchParams(location.search).has('embed') || window.parent !== window;
  let embedReported = false;
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  const FONT = '"Chakra Petch", "Trebuchet MS", system-ui, sans-serif';
  const TAU = Math.PI * 2;
  const rand = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const ease = (rate, dt) => 1 - Math.exp(-rate * dt);
  const $ = s => document.querySelector(s);
  const $$ = s => Array.from(document.querySelectorAll(s));

  // ---------- Catalog ----------
  const UPGRADES = [
    { id: 'rings',  name: 'Wider Rings',  desc: 'Gravity rings are 5% bigger per level.', prices: [50, 100, 200, 350, 500] },
    { id: 'magnet', name: 'Coin Magnet',  desc: 'Pulls in coins from further away.', prices: [40, 80, 160, 300, 450] },
    { id: 'luck',   name: 'Lucky Stars',  desc: 'More bonus stars appear.', prices: [60, 120, 240, 400, 600] },
    { id: 'wind',   name: 'Second Wind',  desc: 'Shields show up more often. Level 5: a shield absorbs 2 misses.', prices: [80, 160, 300, 500, 750] },
    { id: 'golden', name: 'Golden Touch', desc: '+5% chance per level for a coin to count double.', prices: [70, 140, 280, 450, 700] },
  ];
  const GADGETS = [
    { id: 'aim',    name: 'Aim Line',     price: 15, desc: 'Dotted launch line for the first 10 planets.' },
    { id: 'slowmo', name: 'Slow-Mo',      price: 20, desc: 'Double-tap mid-run: half orbit speed for 3 planets.' },
    { id: 'head',   name: 'Head Start',   price: 30, desc: 'Start at planet 10 with +10 points.' },
    { id: 'revive', name: 'Revive Token', price: 40, desc: 'Continue once after game over.' },
    { id: 'rush',   name: 'Coin Rush',    price: 25, desc: '2x coins for the first 20 planets.' },
  ];
  // Cosmetic prices: edit here.
  const LOOKS = {
    comet: [
      { id: 'classic', name: 'Classic',   price: 0,   hue: 35 },
      { id: 'ice',     name: 'Ice Shard', price: 150, hue: 190 },
      { id: 'emerald', name: 'Emerald',   price: 200, hue: 140 },
      { id: 'plasma',  name: 'Plasma',    price: 250, hue: 285 },
      { id: 'ruby',    name: 'Ruby',      price: 300, hue: 350 },
      { id: 'prism',   name: 'Prism',     price: 600, hue: -1 },
    ],
    planet: [
      { id: 'neon',    name: 'Neon',    price: 0 },
      { id: 'glacier', name: 'Glacier', price: 200 },
      { id: 'sunset',  name: 'Sunset',  price: 200 },
      { id: 'pastel',  name: 'Pastel',  price: 250 },
      { id: 'chrome',  name: 'Chrome',  price: 350 },
    ],
    trail: [
      { id: 'spark',    name: 'Sparks',   price: 0 },
      { id: 'stardust', name: 'Stardust', price: 150 },
      { id: 'flame',    name: 'Flame',    price: 250 },
      { id: 'ribbon',   name: 'Ribbon',   price: 350 },
      { id: 'rainbow',  name: 'Rainbow',  price: 500 },
    ],
  };
  const LOOK_GROUPS = [['comet', 'Comet skins'], ['planet', 'Planet themes'], ['trail', 'Trail effects']];
  // [hue, saturation] for planet idx
  const PLANET_THEMES = {
    neon:    i => [(200 + i * 37) % 360, 100],
    glacier: i => [175 + (i * 29) % 70, 90],
    sunset:  i => [[350, 10, 25, 40, 320, 335][i % 6], 100],
    pastel:  i => [(i * 53) % 360, 55],
    chrome:  () => [220, 10],
  };
  const TRAIL_SWATCH = {
    spark: 'linear-gradient(90deg, transparent, hsl(30,100%,60%), #fff)',
    stardust: 'radial-gradient(circle at 20% 50%, #fff 0 2px, transparent 3px), radial-gradient(circle at 50% 30%, #fff 0 1.5px, transparent 2.5px), radial-gradient(circle at 75% 60%, #fff 0 2px, transparent 3px), linear-gradient(90deg, transparent, hsla(220,60%,80%,0.4))',
    flame: 'linear-gradient(90deg, transparent, hsl(5,100%,50%), hsl(40,100%,60%), #fff)',
    ribbon: 'linear-gradient(transparent 40%, hsl(190,100%,65%) 40% 60%, transparent 60%)',
    rainbow: 'linear-gradient(90deg, hsl(0,100%,60%), hsl(60,100%,60%), hsl(120,100%,60%), hsl(190,100%,60%), hsl(280,100%,65%))',
  };

  const ICONS = {
    rings: '<circle cx="12" cy="12" r="3.5"/><circle cx="12" cy="12" r="8.5" stroke-dasharray="3 2.5"/>',
    magnet: '<path d="M6 4v8a6 6 0 0 0 12 0V4"/><path d="M6 8h3.5M14.5 8H18"/>',
    luck: '<path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/>',
    wind: '<path d="M12 3l7 3v5.5c0 4.3-3 7.7-7 9.5-4-1.8-7-5.2-7-9.5V6z"/><path d="M9 12l2 2 4-4"/>',
    golden: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.5"/>',
    aim: '<path d="M4 20L18 6" stroke-dasharray="2 3.2"/><path d="M12 5h7v7"/>',
    slowmo: '<circle cx="12" cy="13" r="7.5"/><path d="M12 9v4l2.5 2M10 3h4"/>',
    head: '<path d="M6 13l6-6 6 6M6 19l6-6 6 6"/>',
    revive: '<path d="M19.5 12A7.5 7.5 0 1 1 17 6.4"/><path d="M19 3v4.5h-4.5"/>',
    rush: '<circle cx="9" cy="12" r="6"/><circle cx="15" cy="12" r="6"/>',
  };
  const svg = id => \`<svg viewBox="0 0 24 24" aria-hidden="true">\${ICONS[id]}</svg>\`;

  const MISSION_DEFS = [
    { type: 'reachRun',  scope: 'run',   tiers: [10, 20, 30],  rewards: [25, 45, 70], text: n => \`Reach \${n} planets in one run\` },
    { type: 'scoreRun',  scope: 'run',   tiers: [40, 100, 200], rewards: [25, 45, 70], text: n => \`Score \${n} in one run\` },
    { type: 'comboRun',  scope: 'run',   tiers: [4, 7, 10],     rewards: [30, 50, 75], text: n => \`Hit a \${n}x perfect combo\` },
    { type: 'stars',     scope: 'total', tiers: [8, 15, 25],    rewards: [25, 40, 60], text: n => \`Collect \${n} stars\` },
    { type: 'coins',     scope: 'total', tiers: [40, 80, 150],  rewards: [25, 40, 60], text: n => \`Pick up \${n} coins\` },
    { type: 'perfects',  scope: 'total', tiers: [10, 20, 35],   rewards: [25, 45, 65], text: n => \`Land \${n} perfect captures\` },
    { type: 'runs',      scope: 'total', tiers: [3, 5, 8],      rewards: [25, 35, 50], text: n => \`Play \${n} runs\` },
    { type: 'shield',    scope: 'total', tiers: [1, 2, 3],      rewards: [30, 50, 75], text: n => n === 1 ? 'Get saved by a shield' : \`Get saved by a shield \${n} times\` },
  ];

  // ---------- Save (one versioned object) ----------
  const SAVE_KEY = 'orbitHop.save';
  const SAVE_VERSION = 1;
  function defaultSave() {
    return {
      v: SAVE_VERSION,
      best: 0,
      coins: 0,
      upgrades: { rings: 0, magnet: 0, luck: 0, wind: 0, golden: 0 },
      gadgets: { aim: 0, slowmo: 0, head: 0, revive: 0, rush: 0 },
      loadout: [],
      looks: { owned: ['comet:classic', 'planet:neon', 'trail:spark'], equipped: { comet: 'classic', planet: 'neon', trail: 'spark' } },
      missions: [],
      lastGift: '',
      sound: true,
      sfxVol: 0.8,
      musicVol: 0.6,
      runs: [],
    };
  }
  function loadSave() {
    const d = defaultSave();
    let s = null;
    try { s = JSON.parse(localStorage.getItem(SAVE_KEY)); } catch (e) { s = null; }
    if (!s || typeof s !== 'object' || typeof s.v !== 'number') {
      // migrate the pre-economy best score
      try { d.best = parseInt(localStorage.getItem('orbitHopBest') || '0', 10) || 0; } catch (e) { /* ignore */ }
      return d;
    }
    const looks = s.looks || {};
    return {
      ...d, ...s,
      v: SAVE_VERSION,
      coins: Math.max(0, Math.floor(+s.coins || 0)),
      upgrades: { ...d.upgrades, ...(s.upgrades || {}) },
      gadgets: { ...d.gadgets, ...(s.gadgets || {}) },
      loadout: Array.isArray(s.loadout) ? s.loadout : [],
      looks: {
        owned: Array.from(new Set([...d.looks.owned, ...(Array.isArray(looks.owned) ? looks.owned : [])])),
        equipped: { ...d.looks.equipped, ...(looks.equipped || {}) },
      },
      missions: Array.isArray(s.missions) ? s.missions.filter(m => MISSION_DEFS.some(def => def.type === m.type)) : [],
      sfxVol: clamp(Number.isFinite(+s.sfxVol) ? +s.sfxVol : d.sfxVol, 0, 1),
      // the old music on/off switch maps to a volume of 0
      musicVol: clamp(Number.isFinite(+s.musicVol) ? +s.musicVol : (s.music === false ? 0 : d.musicVol), 0, 1),
      runs: Array.isArray(s.runs) ? s.runs.filter(r => r && Number.isFinite(r.s)).slice(0, 10) : [],
    };
  }
  function persist() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { /* storage unavailable */ }
  }
  const save = loadSave();
  const today = () => {
    const d = new Date();
    return \`\${d.getFullYear()}-\${String(d.getMonth() + 1).padStart(2, '0')}-\${String(d.getDate()).padStart(2, '0')}\`;
  };
  const up = id => save.upgrades[id] || 0;
  // ---------- Sound (synthesised with Web Audio, no files) ----------
  const sfx = (() => {
    let ac = null, out = null, musicOut = null, noiseBuf = null;
    const SFX_VOL = 0.7;
    function ctxReady() {

        const AC = window.AudioContext || window.webkitAudioContext;

        out = ac.createGain();
        out.gain.value = SFX_VOL * save.sfxVol;
        out.connect(comp);

        musicOut.gain.value = 0;
        musicOut.connect(comp);
        comp.connect(ac.destination);
        noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);

      g.gain.exponentialRampToValueAtTime(vol, at + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, at + dur);

    const semi = n => Math.pow(2, n / 12);

    // ---------- Background music: a small step sequencer ----------
    // A minor loop (Am F C G). The tempo follows the combo, and more layers join as it grows.
    const midi = m => 440 * Math.pow(2, (m - 69) / 12);
    const CHORDS = [[57, 60, 64], [53, 57, 60], [48, 52, 55], [55, 59, 62]];
    const LEAD = [[76, 72, 69, 72, 74, 72, 69, 67], [72, 69, 65, 69, 72, 74, 72, 69], [67, 72, 76, 79, 76, 72, 74, 76], [74, 71, 67, 71, 74, 79, 78, 74]];
    let musicMode = null, getCombo = () => 0, timer = null, nextTime = 0, step = 0, bpm = 92, stopTimer = 0;

      if (lvl >= 0) {

        if (x % 4 === 2 || (lvl >= 1 && x % 2 === 1)) noise(t, 0.035, { vol: x % 4 === 2 ? 0.05 : 0.025, type: 'highpass', freq: 8000, ...d });

        if (lvl >= 3 && x % 2 === 0) tone(midi(LEAD[bar][x / 2]), t, sixteenth * 1.8, { type: 'square', vol: 0.03, ...d });

      if (lvl >= 1 || x % 2 === 0) {

    const music = {
      follow(fn) { getCombo = fn; },
      // 'menu', 'run' or null (fade out)
      mode(m) {

      current() { return musicMode; },
      // live volume changes from the settings sliders

  // ---------- Missions ----------
  function newMission() {
    const active = new Set(save.missions.map(m => m.type));
    const pool = MISSION_DEFS.filter(d => !active.has(d.type));
    const def = pool[Math.floor(Math.random() * pool.length)];
    const tier = Math.random() < 0.45 ? 0 : Math.random() < 0.7 ? 1 : 2;
    return { type: def.type, target: def.tiers[tier], reward: def.rewards[tier], progress: 0 };
  }
  function fillMissions() {
    while (save.missions.length < 3) save.missions.push(newMission());
  }
  fillMissions();
  persist();

  function missionTrack(type, value, mode) {
    let changed = false;
    for (const m of save.missions) {
      if (m.type !== type) continue;
      const before = m.progress;
      m.progress = mode === 'max' ? Math.max(m.progress, value) : m.progress + value;
      changed = changed || m.progress !== before;
    }
    if (changed) checkMissions();
  }
  function checkMissions() {
    let done = false;
    save.missions = save.missions.map(m => {
      if (m.progress < m.target) return m;
      done = true;
      const def = MISSION_DEFS.find(d => d.type === m.type);
      save.coins += m.reward;
      if (run) run.coins.missions += m.reward;
      missionBanner = { text: \`MISSION COMPLETE  +\${m.reward}\`, sub: def.text(m.target), t: 2.6 };
      bumpCoins();

    }).filter(Boolean);

  }

  // ---------- Canvas sizing ----------
  let cssW = 0, cssH = 0, dpr = 1, scale = 1, VW = 400, VH = 700;

    { n: 70, f: 0.08, s: 0.7, a: 0.45, stars: [] },

  function resize() {
    cssW = window.innerWidth;
    cssH = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    scale = Math.min(cssW / 400, cssH / 620);
    VW = cssW / scale;
    VH = cssH / scale;
    const bandW = Math.min(VW, 440);
    bandL = (VW - bandW) / 2;
    bandR = bandL + bandW;

    bgGrad = ctx.createLinearGradient(0, 0, 0, VH);
    bgGrad.addColorStop(0, '#0b0620');
    bgGrad.addColorStop(0.55, '#06051a');
    bgGrad.addColorStop(1, '#020208');

    for (const L of starLayers) {
      L.stars.length = 0;
      const count = Math.round(L.n * (VW * VH) / (400 * 700));
      for (let i = 0; i < count; i++) {
        L.stars.push({ x: Math.random() * VW, y: Math.random() * VH, tw: Math.random() * TAU, hue: Math.random() < 0.2 ? rand(180, 300) : -1 });
      }

    if (comet && comet.planet) camY = targetCamY();
  }

  // ---------- Glow sprite cache ----------
  const spriteCache = new Map();
  function glowSprite(hue, sat = 100, light = 60) {
    const key = hue + '|' + sat + '|' + light;
    let c = spriteCache.get(key);
    if (c) return c;
    c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, \`hsla(\${hue},\${sat}%,95%,1)\`);
    grad.addColorStop(0.25, \`hsla(\${hue},\${sat}%,\${light}%,0.85)\`);
    grad.addColorStop(0.6, \`hsla(\${hue},\${sat}%,\${light}%,0.18)\`);
    grad.addColorStop(1, \`hsla(\${hue},\${sat}%,\${light}%,0)\`);
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
    spriteCache.set(key, c);
    return c;
  }

  // ---------- Game state ----------
  const COMET_SPEED = 620;
